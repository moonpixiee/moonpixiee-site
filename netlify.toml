[build]
  command = "npm run build"
  publish = "dist"

# No redirects: with build.format 'file', dist/<page>.html serves at both
# /<page> and /<page>.html (Netlify pretty URLs), and /<page>/ 301s to
# /<page> — identical to the current production static site. The earlier
# /{page}.html -> /{page} 301s were inert under this layout and are removed
# so the config reflects production's actual behavior. See AM-002.
