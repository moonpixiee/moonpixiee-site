<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Luna's Room · The Library · House of Luna</title>
<link rel="stylesheet" href="/styles/tokens.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Allura&family=Lora:ital@0;1&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  /* LIBRARY ZONE ENGINE v2 — invisible at rest; objects catch light when you look.
     One config, one photoreal room. This file: Luna's Room. */
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{ --gold:#C9A6EC; --paper:#EFE7D8; --ink:#2a2118; --ease:cubic-bezier(.22,1,.36,1); --wake:rgba(200,150,240,.5);
    /* the mockup's typography — Playfair headings, Cormorant body, Allura script accents */
    --font-display:'Playfair Display','Cormorant Garamond',Georgia,serif; --font-book:'Cormorant Garamond','Lora',Georgia,serif; --font-script:'Allura','Snell Roundhand','Segoe Script',cursive; }
  html,body{height:100%;background:#0a0806;overflow:hidden;font-family:var(--font-narrator,Georgia,serif);color:var(--paper);}
  .zone{position:fixed;inset:0;overflow:hidden;background:#0a0806;}
  .env{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:104vw;aspect-ratio:1402/1122;will-change:transform;transition:transform .6s var(--ease);
    background:radial-gradient(80% 60% at 32% 44%, rgba(120,86,42,.5) 0%, transparent 60%), radial-gradient(70% 60% at 76% 58%, rgba(70,52,28,.5) 0%, transparent 62%), linear-gradient(180deg,#1b130c 0%,#0e0a06 100%);}
  @media (max-aspect-ratio:1/1){ .env{width:auto;height:104vh;} }
  .env img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
  /* a plate whose whole composition must stay visible (baked-in title/nav): fit inside */
  .env.contain{width:auto!important;height:100vh!important;max-width:100vw;}
  .env.contain img{object-fit:contain;}
  @media (max-aspect-ratio:1123/1000){ .env.contain{width:100vw!important;height:auto!important;} }
  body.baked .place,body.baked .collection,body.baked .living,body.baked .hint,body.baked .return{display:none;}
  .vignette{position:absolute;inset:0;pointer-events:none;z-index:2;background:radial-gradient(122% 100% at 50% 46%, transparent 40%, rgba(6,4,3,.42) 84%, rgba(6,4,3,.72) 100%);}
  .dust{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2;}
  .mote{position:absolute;width:2px;height:2px;border-radius:50%;background:radial-gradient(circle, rgba(255,224,160,.8), rgba(255,224,160,0));mix-blend-mode:screen;}
  @keyframes rise{0%{transform:translateY(0);opacity:0;}14%{opacity:.6;}80%{opacity:.35;}100%{transform:translateY(-120px) translateX(var(--dx,3px));opacity:0;}}

  /* HOTSPOT — an invisible hit region. Nothing shows until you look. */
  .spot{position:absolute;transform:translate(-50%,-50%);width:var(--sw,4.4%);height:var(--sh,9%);min-width:38px;min-height:48px;cursor:pointer;z-index:5;outline:none;}
  .spot .wake{position:absolute;inset:-34% -44%;border-radius:50%;pointer-events:none;mix-blend-mode:screen;opacity:0;transition:opacity .5s var(--ease), filter .5s var(--ease);
    background:radial-gradient(closest-side, var(--wake), transparent 78%);}
  .spot.astro .wake{background:radial-gradient(closest-side, rgba(186,208,255,.5), rgba(150,180,235,.12) 55%, transparent 76%);}
  .spot:hover .wake,.spot:focus-visible .wake,.spot.awake .wake{opacity:.85;}
  .spot.flash .wake{opacity:1;filter:brightness(1.5);}
  /* WHISPER — a placard that materialises out of shadow. No box. */
  .spot .whisper{position:absolute;left:50%;bottom:120%;transform:translateX(-50%) translateY(8px);width:max-content;max-width:min(74vw,258px);text-align:center;pointer-events:none;opacity:0;filter:blur(3px);transition:opacity .45s var(--ease), transform .45s var(--ease), filter .45s var(--ease);}
  .spot:hover .whisper,.spot:focus-visible .whisper,.spot.awake .whisper,.astro:hover .whisper,.astro:focus-visible .whisper,.astro.awake .whisper{opacity:1;filter:blur(0);transform:translateX(-50%) translateY(0);}
  .whisper::before{content:"";position:absolute;inset:-32% -14%;z-index:-1;pointer-events:none;background:radial-gradient(ellipse 116% 62% at 50% 50%, rgba(8,6,10,.5), transparent 78%);filter:blur(10px);}

  /* ASTRO — a resident, not wallpaper: a transparent sprite layered on the room */
  .astro{position:absolute;transform:translate(-50%,-100%);z-index:4;cursor:pointer;outline:none;}
  .astro .abody{position:relative;z-index:1;width:100%;transform-origin:bottom center;filter:drop-shadow(0 8px 16px rgba(0,0,0,.62));animation:breathe 5.5s ease-in-out infinite, stir 9s ease-in-out infinite;}
  .astro .aground{position:absolute;left:50%;bottom:-1%;transform:translateX(-50%);width:76%;height:9%;border-radius:50%;background:radial-gradient(ellipse closest-side, rgba(0,0,0,.55), transparent 78%);z-index:0;pointer-events:none;filter:blur(2px);}
  .astro .abody img{display:block;width:100%;height:auto;}
  @keyframes breathe{0%,100%{scale:1 1;}50%{scale:1 1.014;}}
  @keyframes stir{0%,82%,100%{rotate:0deg;}90%{rotate:-1.5deg;}96%{rotate:.7deg;}}
  .astro.flip .abody{transform:scaleX(-1);}
  .astro .aglow{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);width:126%;height:62%;border-radius:50%;pointer-events:none;mix-blend-mode:screen;opacity:0;background:radial-gradient(closest-side, rgba(190,210,255,.42), transparent 74%);transition:opacity .5s var(--ease);}
  .astro:hover .aglow,.astro:focus-visible .aglow,.astro.awake .aglow{opacity:.75;}
  .astro.purr .aglow{opacity:1;}
  .astro .whisper{position:absolute;left:50%;bottom:104%;transform:translateX(-50%) translateY(8px);width:max-content;max-width:min(70vw,240px);text-align:center;pointer-events:none;opacity:0;filter:blur(3px);transition:opacity .45s var(--ease), transform .45s var(--ease), filter .45s var(--ease);}
  .whisper .wl{display:block;font-family:var(--font-narrator,Georgia,serif);font-style:italic;font-size:.98rem;line-height:1.4;color:rgba(244,236,220,.96);text-shadow:0 1px 12px rgba(0,0,0,.98);}
  .whisper .wn{display:block;margin-top:.28rem;font-family:var(--font-machine,monospace);font-size:.54rem;letter-spacing:.24em;text-transform:uppercase;color:rgba(227,185,104,.9);text-shadow:0 1px 8px rgba(0,0,0,.95);}

  /* narration lines that rise near an object (ambient / astro / passage) */
  .floatline{position:absolute;transform:translate(-50%,-50%);z-index:6;pointer-events:none;max-width:min(70vw,260px);text-align:center;font-family:var(--font-narrator,serif);font-style:italic;font-size:1.02rem;line-height:1.45;color:rgba(245,238,222,.97);text-shadow:0 1px 14px rgba(0,0,0,.98);opacity:0;animation:floatline 3.4s ease forwards;}
  .floatline::before{content:"";position:absolute;inset:-30% -14%;z-index:-1;background:radial-gradient(ellipse 116% 60% at 50% 50%, rgba(8,6,10,.5), transparent 78%);filter:blur(11px);}
  @keyframes floatline{0%{opacity:0;transform:translate(-50%,-44%);}16%{opacity:1;transform:translate(-50%,-50%);}78%{opacity:1;}100%{opacity:0;transform:translate(-50%,-56%);}}
  /* dwell — sitting; the room settles, dims a touch, and holds */
  .dwell-dim{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;background:radial-gradient(120% 100% at 50% 52%, transparent 30%, rgba(4,3,6,.5) 82%, rgba(4,3,6,.7) 100%);transition:opacity 1.2s var(--ease);}
  .dwell-dim.on{opacity:1;}
  .roomfade{position:fixed;inset:0;z-index:29;background:#000;pointer-events:none;opacity:0;transition:opacity .7s ease .3s;}
  .roomfade.on{opacity:1;}

  /* ===== ARTIFACT VIEWER — objects you pick up; the room stays visible behind ===== */
  .av{position:fixed;inset:0;z-index:20;display:none;place-items:center;padding:clamp(1rem,4vw,2.4rem);}
  .av.open{display:grid;}
  .av-veil{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .5s var(--ease);backdrop-filter:blur(3.5px) brightness(.82);-webkit-backdrop-filter:blur(3.5px) brightness(.82);background:radial-gradient(120% 100% at 50% 50%, transparent 34%, rgba(4,3,6,.34) 78%, rgba(4,3,6,.5) 100%);}
  .av.open .av-veil{opacity:1;}
  .av-hold{position:relative;z-index:2;display:grid;place-items:center;width:100%;height:100%;}
  .av .particles{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1;}
  .av .p{position:absolute;width:2px;height:2px;border-radius:50%;background:radial-gradient(circle,rgba(255,224,150,.9),transparent);mix-blend-mode:screen;animation:pfloat linear infinite;}
  @keyframes pfloat{0%{transform:translateY(24px);opacity:0;}20%{opacity:.8;}100%{transform:translateY(-130px);opacity:0;}}
  .art-paper{background:linear-gradient(150deg,#efe6d0,#e6d9ba 55%,#d8c8a2);color:#3a2c1a;border:1px solid #c3ab72;box-shadow:0 40px 100px -30px rgba(0,0,0,.78), inset 0 0 60px rgba(150,120,60,.12);}
  .art-scroll{background:linear-gradient(160deg,#1c1712,#221a12 60%,#14100b);color:#e8d9b4;border:1px solid #8a6a2e;box-shadow:0 40px 110px -28px rgba(0,0,0,.85), inset 0 0 70px rgba(120,90,40,.16), 0 0 0 1px rgba(198,160,90,.25);}
  .art-gold-edge{position:relative;} .art-gold-edge::after{content:"";position:absolute;inset:7px;border:1px solid rgba(198,160,90,.5);border-radius:3px;pointer-events:none;}
  .art-kind{font-family:var(--font-machine,monospace);font-size:.58rem;letter-spacing:.26em;text-transform:uppercase;color:#8a6a2e;}
  .art-scroll .art-kind,.lore-art .art-kind{color:#c6a45a;}
  .art-title{font-family:var(--font-architect,'Cormorant Garamond',serif);font-weight:500;font-size:clamp(1.4rem,3.6vw,2.1rem);line-height:1.08;margin:.25rem 0 .7rem;color:#33261a;}
  .art-scroll .art-title,.lore-art .art-title{color:#f0e2bd;}
  .art-body{font-family:var(--font-narrator,Georgia,serif);font-size:1rem;line-height:1.78;white-space:pre-wrap;}
  .art-acts{display:flex;gap:.55rem;flex-wrap:wrap;margin-top:1.4rem;padding-top:1rem;border-top:1px solid rgba(120,90,40,.3);}
  .art-act{font-family:var(--font-architect,serif);font-variant:small-caps;letter-spacing:.05em;font-size:1rem;cursor:pointer;padding:.46rem 1.2rem;border-radius:3px;border:1px solid #b39a5f;background:transparent;color:#5a4526;transition:background .3s,color .3s;}
  .art-scroll .art-act,.lore-art .art-act{color:#d9c68f;border-color:#8a6a2e;}
  .art-act:hover{background:#5a4526;color:#efe6d2;}
  .art-act.keep{background:#6a5326;border-color:#6a5326;color:#efe6d2;} .art-act.keep:hover{background:#4a3418;}
  .art-act.kept{background:#3f6b3a;border-color:#3f6b3a;color:#eafbe4;pointer-events:none;}
  .av.r-rare .art,.av.r-legendary .art,.av.r-rare .book-spread,.av.r-legendary .book-spread{box-shadow:0 40px 110px -24px rgba(0,0,0,.85), 0 0 40px rgba(227,185,104,.3)!important;}
  .rare-tag{display:inline-block;margin-left:.5rem;font-family:var(--font-machine,monospace);font-size:.52rem;letter-spacing:.24em;text-transform:uppercase;color:#c6a45a;border:1px solid rgba(198,160,90,.5);border-radius:3px;padding:.1rem .4rem;vertical-align:middle;}
  .art.page{width:min(88vw,440px);max-height:84vh;overflow:auto;padding:clamp(1.5rem,4vw,2.4rem);border-radius:3px;}
  .av.open .art.page{animation:floatUp .9s var(--ease) both;}
  @keyframes floatUp{0%{opacity:0;transform:translateY(60vh) rotate(-7deg) scale(.72);}55%{opacity:1;}100%{opacity:1;transform:translateY(0) rotate(0) scale(1);}}
  /* LORE — boxless placard, materialises from shadow (no parchment card) */
  .art.lore-art{width:min(80vw,520px);max-height:82vh;overflow:auto;text-align:center;padding:1rem;}
  .art.lore-art .art-body{color:rgba(238,231,216,.92);}
  .art.lore-art .art-acts{justify-content:center;border-top:none;margin-top:1.6rem;}
  .art.lore-art .art-act{border-color:rgba(198,160,90,.5);color:#d9c68f;}
  .lore-art::after{content:"";position:absolute;} /* placeholder */
  .av.open .art.lore-art{animation:loreIn .9s var(--ease) both;}
  @keyframes loreIn{0%{opacity:0;filter:blur(8px);transform:translateY(14px);}100%{opacity:1;filter:blur(0);transform:translateY(0);}}
  .collroll{width:min(92vw,640px);max-height:84vh;overflow:auto;padding:clamp(1.5rem,4vw,2.3rem);border-radius:5px;}
  .ki-count{font-family:var(--font-machine,monospace);font-size:.6rem;letter-spacing:.24em;text-transform:uppercase;color:#c6a45a;margin:.2rem 0 1.1rem;}
  .keeplist{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:.7rem;}
  .keepitem{border:1px solid rgba(198,160,90,.3);border-radius:4px;padding:.7rem .85rem;background:rgba(198,160,90,.06);display:flex;flex-direction:column;gap:.15rem;}
  .ki-kind{font-family:var(--font-machine,monospace);font-size:.5rem;letter-spacing:.2em;text-transform:uppercase;color:#c6a45a;}
  .ki-title{font-family:var(--font-architect,serif);font-size:1.02rem;color:#f0e2bd;line-height:1.15;}
  .ki-zone{font-family:var(--font-narrator,serif);font-style:italic;font-size:.78rem;color:rgba(233,224,208,.55);}
  .ki-empty{font-family:var(--font-narrator,serif);font-style:italic;font-size:1.05rem;line-height:1.7;color:rgba(233,224,208,.82);text-align:center;padding:1.5rem 0;}
  /* THE HOUSE NETWORK — the computer screen */
  .hnet{width:min(92vw,540px);max-height:84vh;overflow:auto;border-radius:8px;background:linear-gradient(180deg,#0b0f1e,#080a14);border:1px solid #2a3350;box-shadow:0 40px 110px -28px rgba(0,0,0,.9), inset 0 0 60px rgba(60,90,180,.14), 0 0 0 1px rgba(120,150,220,.15);color:#cdd8f5;font-family:var(--font-machine,monospace);}
  .hn-bar{display:flex;justify-content:space-between;align-items:center;padding:.75rem 1.1rem;border-bottom:1px solid rgba(120,150,220,.2);}
  .hn-title{letter-spacing:.24em;font-size:.7rem;color:#a9c0f5;}
  .hn-status{font-size:.56rem;letter-spacing:.16em;color:#7fdca0;}
  .hn-list{display:flex;flex-direction:column;padding:.6rem;gap:.12rem;}
  .hn-item{display:flex;align-items:center;gap:.65rem;text-align:left;background:transparent;border:none;color:#cdd8f5;font-family:var(--font-machine,monospace);font-size:.82rem;letter-spacing:.06em;padding:.58rem .75rem;border-radius:4px;cursor:pointer;transition:background .2s,color .2s;}
  .hn-item:hover{background:rgba(120,150,220,.14);color:#eaf1ff;}
  .hn-dot{width:6px;height:6px;border-radius:50%;background:#5f77c8;box-shadow:0 0 8px #5f77c8;flex:none;}
  .hn-foot{padding:.6rem 1.1rem 1rem;border-top:1px solid rgba(120,150,220,.2);}
  .hn-foot .art-act{color:#a9c0f5;border-color:rgba(120,150,220,.4);}
  .hn-foot .art-act:hover{background:rgba(120,150,220,.2);color:#fff;}
  /* MoonNet */
  .mn-boot{font-family:var(--font-machine,monospace);font-size:.82rem;line-height:1.75;color:#9fdcb0;white-space:pre-wrap;padding:1.5rem 1.4rem;margin:0;min-height:260px;}
  .mn-bar{padding:.85rem 1.15rem;border-bottom:1px solid rgba(120,150,220,.2);}
  .mn-title{display:block;letter-spacing:.3em;font-size:.8rem;color:#dbe4ff;}
  .mn-sub{display:block;margin-top:.25rem;font-size:.58rem;letter-spacing:.12em;color:#8090c2;}
  .mn-list{display:flex;flex-direction:column;padding:.6rem;gap:.12rem;}
  .mn-item{display:flex;align-items:center;gap:.7rem;text-align:left;background:transparent;border:none;color:#cdd8f5;font-family:var(--font-machine,monospace);font-size:.86rem;letter-spacing:.05em;padding:.62rem .78rem;border-radius:4px;cursor:pointer;transition:background .2s,color .2s;}
  .mn-item:hover{background:rgba(120,150,220,.14);color:#eaf1ff;}
  .mn-star{color:#8aa2e8;} .mn-door{color:#8aa2e8;font-size:.92em;}
  .mn-notes{padding:.75rem;display:flex;flex-direction:column;gap:.7rem;}
  .mn-note{border:1px solid rgba(120,150,220,.18);border-radius:5px;padding:.85rem .95rem;background:rgba(120,150,220,.05);}
  .mn-who{font-family:var(--font-machine,monospace);font-size:.54rem;letter-spacing:.16em;text-transform:uppercase;color:#8090c2;margin:0 0 .35rem;}
  .mn-txt{font-family:var(--font-narrator,Georgia,serif);font-style:italic;font-size:1.02rem;color:#e6ecff;margin:0;line-height:1.5;}
  .mn-heart{font-family:var(--font-machine,monospace);font-size:.62rem;color:#c98aa8;margin:.45rem 0 0;}
  .mn-leave{margin-top:.1rem;text-align:left;background:transparent;border:1px dashed rgba(120,150,220,.3);border-radius:5px;color:#8f9fce;font-family:var(--font-machine,monospace);font-size:.74rem;padding:.65rem .85rem;cursor:pointer;}
  .mn-leave:hover{background:rgba(120,150,220,.1);color:#cdd8f5;}
  .hn-foot [data-back]{color:#a9c0f5;border-color:rgba(120,150,220,.4);}
  /* RECEIVE YOUR KEY — the first-visit ceremony */
  .keyrite{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:#05040a;opacity:0;transition:opacity 1s ease, background 1.6s ease;text-align:center;padding:2rem;}
  .keyrite.show{opacity:1;}
  .keyrite.gone{opacity:0;}
  .kr-inner{max-width:580px;}
  .kr-line{font-family:var(--font-architect,'Cormorant Garamond',serif);font-size:clamp(1.2rem,3vw,1.95rem);color:rgba(240,232,216,.95);line-height:1.5;margin:.5rem 0;opacity:0;transform:translateY(8px);animation:krin 1.3s ease forwards;}
  .kr-line.d1{animation-delay:1.2s;} .kr-line.d2{animation-delay:2.4s;}
  .kr-line.show2{animation:krin 1.3s ease forwards;} .kr-line.show2.d1{animation-delay:1s;}
  @keyframes krin{to{opacity:1;transform:translateY(0);}}
  .kr-line.show2.d2{animation-delay:2s;}
  .kr-btn{margin-top:1.4rem;font-family:var(--font-architect,serif);font-variant:small-caps;letter-spacing:.14em;font-size:1.12rem;color:#f0e2bd;background:transparent;border:1px solid rgba(227,185,104,.6);border-radius:4px;padding:.7rem 1.9rem;cursor:pointer;transition:background .3s,color .3s;}
  .kr-btn:hover{background:rgba(227,185,104,.18);color:#fff;}
  .kr-btn:disabled{opacity:.5;cursor:default;}
  .kr-d{opacity:0;animation:krin 1.3s ease 3.7s forwards;}
  .kr-namewrap{margin-top:1.9rem;opacity:0;animation:krin 1.3s ease 3.5s forwards;display:flex;flex-direction:column;gap:.55rem;align-items:center;}
  .kr-label{font-family:var(--font-narrator,serif);font-style:italic;font-size:.92rem;color:rgba(240,232,216,.68);}
  .kr-label span{opacity:.55;font-size:.85em;}
  .kr-form{display:flex;flex-direction:column;gap:.7rem;align-items:center;margin:1.5rem auto 0;}
  .kr-input{font-family:var(--font-narrator,Georgia,serif);font-size:1rem;color:#f0e2bd;background:rgba(255,255,255,.04);border:1px solid rgba(227,185,104,.35);border-radius:4px;padding:.7rem .9rem;text-align:center;width:min(86vw,320px);}
  .kr-input::placeholder{color:rgba(240,232,216,.4);font-style:italic;}
  .kr-input:focus{outline:none;border-color:rgba(227,185,104,.75);background:rgba(255,255,255,.06);}
  .kr-form .kr-btn{margin-top:.3rem;}
  .kr-err{min-height:1.2em;margin-top:.7rem;font-family:var(--font-narrator,serif);font-style:italic;font-size:.9rem;color:#d69a9a;}
  .kr-alt{margin-top:.5rem;background:none;border:none;color:rgba(227,185,104,.72);font-family:var(--font-narrator,serif);font-style:italic;font-size:.88rem;cursor:pointer;text-decoration:underline;text-underline-offset:3px;}
  .kr-alt:hover{color:#f0e2bd;}
  .kr-unlock{display:flex;flex-direction:column;align-items:center;gap:.3rem;}
  .kr-key{font-size:2.7rem;line-height:1;opacity:0;animation:krkey 1.4s ease .15s forwards;}
  @keyframes krkey{0%{opacity:0;transform:rotate(-42deg) scale(.7);}45%{opacity:1;}100%{opacity:1;transform:rotate(0) scale(1);}}
  .kr-door{font-size:2.7rem;line-height:1;margin-top:.5rem;opacity:0;animation:krin 1.2s ease 1.9s forwards;}
  .lorewrap{position:relative;}
  .lorewrap::before{content:"";position:absolute;inset:-30% -20%;z-index:-1;background:radial-gradient(56% 60% at 50% 50%, rgba(8,6,12,.7), transparent 72%);filter:blur(10px);}
  .art.book{width:min(94vw,760px);display:flex;flex-direction:column;gap:.7rem;perspective:1800px;}
  .book-spread{position:relative;height:min(66vh,460px);display:grid;grid-template-columns:1fr 1fr;border-radius:5px;overflow:hidden;transform-origin:center;}
  .av.open .art.book .book-spread{animation:bookIn .95s var(--ease) both;}
  @keyframes bookIn{0%{opacity:0;transform:rotateX(26deg) scale(.7);}100%{opacity:1;transform:rotateX(0) scale(1);}}
  .book-page{padding:clamp(1.1rem,2.6vw,1.8rem);overflow:auto;}
  .book-page.left{background:linear-gradient(120deg,#e9dcbd,#ded0ad);box-shadow:inset -22px 0 40px -24px rgba(80,55,20,.7);}
  .book-page.right{background:linear-gradient(240deg,#e9dcbd,#ded0ad);box-shadow:inset 22px 0 40px -24px rgba(80,55,20,.7);}
  .book-gutter{position:absolute;left:50%;top:0;bottom:0;width:2px;transform:translateX(-50%);background:rgba(80,55,20,.35);}
  .book-foot{padding:.2rem clamp(1rem,3vw,1.6rem) .8rem;}
  .book-foot .art-acts{margin-top:.4rem;border-top:none;justify-content:center;}
  /* ===== THE TOME — the mockup's living-book chrome (journal + collectible book) =====
     Aged parchment, deckled edges, warm gutter shadow, gold corners, ribbons that
     sway, and buttons shaped as fabric bookmarks — never modern UI. Swap in real
     parchment / pressed-flower / cover PNGs later; this is the CSS stand-in. */
  .art.book{position:relative;}
  .book-spread{background:linear-gradient(135deg,#efe4c6,#e7d9b6 52%,#dccaa0);border:1px solid #c9b47a;box-shadow:0 44px 120px -30px rgba(0,0,0,.82), inset 0 0 90px rgba(150,116,54,.16);}
  .book-page{position:relative;background:transparent!important;color:#3a2c1a;}
  .book-page.left{box-shadow:inset -30px 0 52px -30px rgba(80,55,20,.66);}
  .book-page.right{box-shadow:inset 30px 0 52px -30px rgba(80,55,20,.66);}
  /* deckled edges + subtle foxing/imperfection */
  .book-spread::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;border-radius:5px;
    box-shadow:inset 0 0 0 1px rgba(120,90,40,.18), inset 0 0 34px rgba(120,86,30,.14);
    background:radial-gradient(60% 40% at 18% 22%, rgba(150,110,50,.08), transparent 60%), radial-gradient(50% 40% at 82% 78%, rgba(120,80,30,.09), transparent 60%);}
  /* gold corners */
  .gold-corner{position:absolute;width:26px;height:26px;z-index:3;pointer-events:none;border-color:rgba(198,160,90,.7);border-style:solid;border-width:0;}
  .gold-corner.tl{top:6px;left:6px;border-top-width:1.5px;border-left-width:1.5px;border-top-left-radius:4px;}
  .gold-corner.tr{top:6px;right:6px;border-top-width:1.5px;border-right-width:1.5px;border-top-right-radius:4px;}
  .gold-corner.bl{bottom:6px;left:6px;border-bottom-width:1.5px;border-left-width:1.5px;border-bottom-left-radius:4px;}
  .gold-corner.br{bottom:6px;right:6px;border-bottom-width:1.5px;border-right-width:1.5px;border-bottom-right-radius:4px;}
  /* ribbons & bookmarks hanging from the top of the tome — a living journal */
  .tome-ribbons{position:absolute;top:-10px;right:34px;display:flex;gap:9px;z-index:4;pointer-events:none;}
  .ribbon{width:11px;height:56px;border-radius:0 0 3px 3px;transform-origin:top center;box-shadow:0 4px 8px -3px rgba(0,0,0,.5);animation:sway 6.5s ease-in-out infinite;}
  .ribbon::after{content:"";position:absolute;bottom:-6px;left:0;right:0;height:8px;background:inherit;clip-path:polygon(0 0,100% 0,50% 100%);}
  .ribbon.r1{height:64px;background:#7a2740;animation-delay:-.6s;} .ribbon.r2{height:50px;background:#b98a3c;animation-delay:-2.1s;} .ribbon.r3{height:58px;background:#4a2c3a;animation-delay:-3.4s;}
  @keyframes sway{0%,100%{transform:rotate(-2.2deg);}50%{transform:rotate(2.4deg);}}
  /* close X, top-right, museum style */
  .tome-x{position:absolute;top:-14px;right:-14px;width:38px;height:38px;z-index:6;border-radius:50%;border:1px solid rgba(198,160,90,.5);background:rgba(20,14,10,.82);color:rgba(233,216,180,.9);font-family:var(--font-book);font-size:1.2rem;line-height:1;cursor:pointer;display:grid;place-items:center;transition:background .3s,color .3s,transform .3s;}
  .tome-x:hover{background:rgba(198,160,90,.22);color:#fff;transform:rotate(90deg);}
  /* fabric-bookmark buttons — stacked cloth tabs, not modern UI */
  .book-foot .art-acts,.fb-acts.tome{flex-direction:column;align-items:center;gap:.5rem;}
  .book-foot .art-act,.fb-acts.tome .fb-take,.fb-acts.tome .fb-leave{position:relative;font-family:var(--font-book);font-weight:600;font-variant:normal;letter-spacing:.05em;font-size:1.04rem;
    width:min(74vw,268px);text-align:center;padding:.62rem 1.4rem .74rem;border:none;border-radius:2px;cursor:pointer;color:#f4ead2;
    clip-path:polygon(0 0,100% 0,100% 72%,50% 100%,0 72%);box-shadow:0 6px 14px -6px rgba(0,0,0,.55);transition:transform .2s,filter .3s;}
  .book-foot .art-act:hover,.fb-acts.tome .fb-take:hover,.fb-acts.tome .fb-leave:hover{transform:translateY(-2px);filter:brightness(1.08);background-image:none;}
  .book-foot .art-act:nth-child(1){background:#7a2740;} .book-foot .art-act:nth-child(2){background:#8a6a2e;} .book-foot .art-act:nth-child(3){background:#4a3320;}
  .book-foot .art-act.keep,.book-foot .art-act.kept{background:#3f6b3a;color:#eafbe4;}
  .fb-acts.tome .fb-take{background:#7a2740;} .fb-acts.tome .fb-take.kept{background:#3f6b3a;} .fb-acts.tome .fb-leave{background:#4a3320;}
  /* the journal's dynamic page (mockup: date · The House remembers · keeps · Astro) */
  .jr-date{display:block;font-family:var(--font-script);font-size:1.5rem;color:#6a4a2a;margin-bottom:.4rem;}
  .jr-h{font-family:var(--font-display);font-weight:600;font-size:clamp(1.5rem,3.4vw,2rem);line-height:1.06;color:#33261a;margin:.3rem 0 1rem;}
  .jr-lines{font-family:var(--font-script);font-size:1.32rem;line-height:1.75;color:#5a4326;}
  .jr-warm{font-family:var(--font-book);font-style:italic;font-size:.98rem;color:#7a5a2e;margin:.1rem 0 1rem;}
  .jr-cont{font-family:var(--font-book);font-weight:600;font-size:1.08rem;color:#4a3620;margin-top:1.1rem;}
  .book-page .art-kind{color:#8a6a2e;} .book-page .art-title{font-family:var(--font-display);}
  .pressed-flower{position:absolute;bottom:8%;right:14%;width:66px;height:66px;z-index:3;pointer-events:none;opacity:.9;
    background:radial-gradient(circle at 50% 50%, #9a8fb0 6%, transparent 7%), conic-gradient(from 0deg, #8a7aa0, #b3a0c6, #8a7aa0, #b3a0c6, #8a7aa0);
    -webkit-mask:radial-gradient(circle at 50% 50%, #000 8%, transparent 9%), repeating-conic-gradient(#000 0deg 30deg, transparent 30deg 60deg);mask:radial-gradient(circle at 50% 50%, #000 8%, transparent 9%);border-radius:50%;filter:saturate(.7) brightness(.9);}
  .pressed-stem{position:absolute;bottom:2%;right:19%;width:2px;height:9%;background:linear-gradient(#7a8a5a,#5a6a3a);z-index:3;pointer-events:none;transform:rotate(6deg);}
  /* Luna's Collection — a shelf of spines you can pull down */
  .shelf-sub{font-family:var(--font-narrator,serif);font-style:italic;font-size:.92rem;color:rgba(233,224,208,.6);margin:.2rem 0 .4rem;}
  .shelf-row{display:flex;gap:.55rem;justify-content:center;align-items:flex-end;flex-wrap:wrap;padding:1.3rem 0 1.1rem;min-height:200px;}
  .shelf-spine{position:relative;width:clamp(44px,9vw,58px);height:clamp(168px,29vh,214px);border:none;border-radius:2px 3px 3px 2px;cursor:pointer;
    background:linear-gradient(90deg, color-mix(in srgb,var(--sp,#3a1a2e) 62%,#000), var(--sp,#3a1a2e) 34%, color-mix(in srgb,var(--sp,#3a1a2e) 78%,#000));
    box-shadow:0 12px 24px -9px rgba(0,0,0,.72), inset 2px 0 4px rgba(255,255,255,.06), inset -3px 0 8px rgba(0,0,0,.42);
    display:grid;place-items:center;transition:transform .3s var(--ease), box-shadow .3s;}
  .shelf-spine::before{content:"";position:absolute;top:8px;bottom:8px;left:5px;width:2px;background:color-mix(in srgb,var(--spf,#e3b968) 55%,transparent);border-radius:2px;box-shadow:6px 0 0 -1px color-mix(in srgb,var(--spf,#e3b968) 30%,transparent);}
  .shelf-spine:hover,.shelf-spine:focus-visible{transform:translateY(-12px);outline:none;box-shadow:0 22px 36px -11px rgba(0,0,0,.78), 0 0 24px color-mix(in srgb,var(--spf,#e3b968) 42%,transparent);}
  .sp-title{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--font-book,'Cormorant Garamond',serif);font-weight:600;font-size:.94rem;letter-spacing:.02em;color:var(--spf,#e3b968);text-shadow:0 1px 3px rgba(0,0,0,.65);padding:.5rem 0;}
  /* the launch promo — a small, matte book resting on the velvet, a soft ribbon
     wrapped round it. A placeholder for Luna's cover PNG; kept muted so it sits in
     the scene rather than floating on top of it. */
  .bookobj.promo .bcover{box-shadow:0 12px 20px -8px rgba(0,0,0,.8), inset 3px 0 0 rgba(0,0,0,.45), inset 0 2px 6px rgba(255,220,170,.06);filter:brightness(.82) saturate(.85);}
  .bookobj.promo .bshadow{bottom:-10%;width:104%;height:16%;background:radial-gradient(ellipse closest-side, rgba(0,0,0,.72), transparent 74%);}
  .bookobj.promo .bfoil{font-size:.42rem;opacity:.75;}
  .bookobj.promo .ribbon-band{position:absolute;top:-4%;bottom:-4%;left:50%;width:17%;transform:translateX(-50%) rotate(-3deg);z-index:2;pointer-events:none;
    background:linear-gradient(90deg,#3e1420,#6a2236 50%,#3e1420);box-shadow:0 0 6px rgba(0,0,0,.55), inset 0 0 5px rgba(255,255,255,.08);filter:brightness(.92);}
  .bookobj.promo .ribbon-band::after{content:"";position:absolute;left:-32%;right:-32%;top:40%;height:22%;background:radial-gradient(circle at 50% 50%, #6a2236 24%, #3e1420 58%, transparent 70%);}
  .art.letter{width:min(88vw,440px);max-height:84vh;overflow:auto;padding:clamp(1.6rem,4vw,2.4rem) clamp(1.5rem,4vw,2.4rem) clamp(1.4rem,3vw,2rem);border-radius:2px;position:relative;}
  .av.open .art.letter{animation:floatUp .8s var(--ease) both;}
  .seal{position:absolute;top:-20px;left:50%;transform:translateX(-50%);width:60px;height:60px;border-radius:50%;cursor:pointer;z-index:3;background:radial-gradient(circle at 38% 34%,#a33b46,#6a2130 68%,#4a1622);box-shadow:0 8px 20px -6px rgba(0,0,0,.7), inset 0 2px 6px rgba(255,180,180,.3);display:grid;place-items:center;color:rgba(255,220,220,.85);font-size:1.4rem;transition:transform .5s var(--ease),opacity .5s;}
  .seal::after{content:"\2766";}
  .letter .fold{max-height:0;overflow:hidden;opacity:0;transition:max-height .8s var(--ease),opacity .6s;}
  .letter .prompt{text-align:center;font-style:italic;color:#6a5326;margin-top:1.2rem;}
  .letter.open-seal .seal{animation:sealcrack .6s ease forwards;}
  @keyframes sealcrack{40%{transform:translateX(-50%) scale(1.12);}100%{transform:translateX(-50%) scale(.55) rotate(15deg);opacity:0;}}
  .letter.open-seal .fold{max-height:64vh;opacity:1;}
  .letter.open-seal .prompt{display:none;}
  .art.object{width:min(92vw,620px);max-height:84vh;display:grid;grid-template-columns:auto 1fr;gap:clamp(1rem,3vw,1.8rem);align-items:center;padding:clamp(1.5rem,4vw,2.3rem);border-radius:4px;}
  .relic{width:clamp(84px,13vw,130px);height:clamp(140px,22vw,210px);display:grid;place-items:center;perspective:800px;}
  .relic svg{width:100%;height:100%;filter:drop-shadow(0 8px 20px rgba(0,0,0,.6));animation:turn 7s linear infinite;}
  @keyframes turn{from{transform:rotateY(0);}to{transform:rotateY(360deg);}}
  .art.mirror{width:min(88vw,500px);display:flex;flex-direction:column;gap:.7rem;}
  .mirror-glass{position:relative;height:min(58vh,540px);border-radius:48% 48% 44% 44%/8% 8% 5% 5%;overflow:hidden;background:linear-gradient(180deg,#14141c,#0a0a10);box-shadow:0 0 0 2px #b39a5f,0 40px 120px -30px #000, inset 0 0 80px rgba(120,140,200,.14);}
  .av.open .art.mirror .mirror-glass{animation:floatUp .9s var(--ease) both;}
  .mirror-glass .surface{position:absolute;inset:0;background:radial-gradient(60% 70% at 50% 38%, rgba(150,170,220,.14), transparent 70%);}
  .mirror-glass .figure{position:absolute;left:50%;top:60%;transform:translateX(-50%);width:20%;height:44%;border-radius:50% 50% 40% 40%;background:radial-gradient(circle at 50% 28%, rgba(210,220,255,.42), transparent 66%);opacity:0;}
  .mirror-glass.stirred .figure{animation:appear 4s ease 4.5s forwards;}
  @keyframes appear{0%{opacity:0;transform:translateX(-50%) translateY(20px);}100%{opacity:.55;transform:translateX(-50%) translateY(0);}}
  .house-notices{position:fixed;inset:0;z-index:19;pointer-events:none;opacity:0;background:radial-gradient(120% 90% at 50% 60%, rgba(240,180,90,.16), transparent 70%);}
  .house-notices.go{animation:notice 3.4s ease forwards;}
  @keyframes notice{0%{opacity:0;}12%{opacity:1;}24%{opacity:.3;}42%{opacity:.85;}100%{opacity:0;}}
  .notice-line{position:fixed;left:0;right:0;top:15%;text-align:center;z-index:24;pointer-events:none;font-family:var(--font-architect,serif);font-variant:small-caps;letter-spacing:.2em;font-size:clamp(1rem,2.4vw,1.5rem);color:rgba(245,220,170,.96);text-shadow:0 0 24px rgba(240,180,90,.8);opacity:0;}
  .notice-line.go{animation:noticeLine 3.4s ease forwards;}
  @keyframes noticeLine{0%{opacity:0;transform:translateY(8px);}18%{opacity:1;transform:translateY(0);}80%{opacity:1;}100%{opacity:0;}}

  /* ===== THE FEATURED BOOK — a real object layer resting on the nightstand ===== */
  .bookobj{position:absolute;transform:translate(-50%,-100%);z-index:4;cursor:pointer;outline:none;transition:transform .55s var(--ease), opacity .55s var(--ease);}
  .bookobj .bshadow{position:absolute;left:50%;bottom:-6%;transform:translateX(-50%);width:88%;height:12%;border-radius:50%;background:radial-gradient(ellipse closest-side, rgba(0,0,0,.6), transparent 78%);filter:blur(2px);z-index:0;pointer-events:none;transition:opacity .55s var(--ease);}
  .bookobj .bcover{position:relative;z-index:1;width:100%;border-radius:2px 4px 4px 2px;overflow:hidden;transform-origin:bottom center;
    background:linear-gradient(120deg, var(--fb-cover,#241019), color-mix(in srgb, var(--fb-cover,#241019) 70%, #000) 100%);
    box-shadow:0 10px 22px -8px rgba(0,0,0,.7), inset 3px 0 0 rgba(0,0,0,.35), inset -2px 0 5px rgba(255,255,255,.05);
    aspect-ratio:130/180;display:grid;place-items:center;padding:14%;}
  .bookobj .bcover img{width:100%;height:100%;object-fit:cover;border-radius:2px 4px 4px 2px;}
  .bookobj .bfoil{font-family:var(--font-architect,'Cormorant Garamond',serif);text-align:center;line-height:1.08;color:var(--fb-foil,#e3b968);
    font-size:.5rem;letter-spacing:.02em;text-shadow:0 1px 2px rgba(0,0,0,.6);}
  .bookobj .bglow{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);width:150%;height:120%;border-radius:50%;pointer-events:none;mix-blend-mode:screen;opacity:0;background:radial-gradient(closest-side, rgba(255,214,140,.42), transparent 72%);transition:opacity .5s var(--ease);z-index:0;}
  .bookobj:hover,.bookobj:focus-visible,.bookobj.awake{transform:translate(-50%,-106%);}
  .bookobj:hover .bglow,.bookobj:focus-visible .bglow,.bookobj.awake .bglow{opacity:.8;}
  .bookobj .whisper{position:absolute;left:50%;bottom:112%;transform:translateX(-50%) translateY(8px);width:max-content;max-width:min(66vw,220px);text-align:center;pointer-events:none;opacity:0;filter:blur(3px);transition:opacity .45s var(--ease), transform .45s var(--ease), filter .45s var(--ease);z-index:2;}
  .bookobj:hover .whisper,.bookobj:focus-visible .whisper,.bookobj.awake .whisper{opacity:1;filter:blur(0);transform:translateX(-50%) translateY(0);}
  .bookobj.lift{transform:translate(-50%,-160%) rotate(-4deg) scale(1.08);}
  .bookobj.gone{opacity:0;transform:translate(-50%,-210%) rotate(-6deg) scale(1.12);}
  .bookobj.gone .bshadow{opacity:0;}

  /* the Featured Book viewer — cover, then a turning spread, then take-it-home */
  .fbook{width:min(94vw,720px);display:flex;flex-direction:column;gap:.8rem;perspective:2000px;}
  .fb-stage{position:relative;height:min(66vh,470px);}
  .fb-cover-card{position:absolute;inset:0;display:grid;place-items:center;border-radius:4px 8px 8px 4px;overflow:hidden;
    background:linear-gradient(125deg, var(--fb-cover,#241019), color-mix(in srgb, var(--fb-cover,#241019) 62%, #000));
    box-shadow:0 40px 110px -28px rgba(0,0,0,.85), inset 5px 0 0 rgba(0,0,0,.4), 0 0 0 1px color-mix(in srgb, var(--fb-foil,#e3b968) 30%, transparent);
    text-align:center;padding:2rem;transform-origin:left center;}
  .fb-cover-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .av.open .fb-cover-card{animation:fbCoverIn 1s var(--ease) both;}
  @keyframes fbCoverIn{0%{opacity:0;transform:translateY(50vh) rotate(-6deg) scale(.74);}60%{opacity:1;}100%{opacity:1;transform:translateY(0) rotate(0) scale(1);}}
  .fb-cover-card.opening{animation:fbOpen 1s var(--ease) forwards;}
  @keyframes fbOpen{0%{transform:rotateY(0);opacity:1;}70%{opacity:1;}100%{transform:rotateY(-118deg);opacity:0;}}
  .fb-title{font-family:var(--font-architect,'Cormorant Garamond',serif);font-weight:500;font-size:clamp(1.8rem,5vw,2.9rem);line-height:1.02;color:var(--fb-foil,#e3b968);text-shadow:0 2px 14px rgba(0,0,0,.6);}
  .fb-by{display:block;margin-top:1rem;font-family:var(--font-machine,monospace);font-size:.62rem;letter-spacing:.34em;text-transform:uppercase;color:color-mix(in srgb, var(--fb-foil,#e3b968) 82%, #fff);}
  .fb-tag{position:absolute;bottom:1.1rem;left:0;right:0;text-align:center;font-family:var(--font-narrator,serif);font-style:italic;font-size:.9rem;color:rgba(240,232,216,.6);}
  .fb-crescent{position:absolute;top:16%;left:0;right:0;text-align:center;font-size:2.6rem;color:var(--fb-foil,#e3b968);text-shadow:0 0 20px rgba(227,185,104,.55);}
  .fb-title{font-family:var(--font-display,'Playfair Display',serif);}
  .fb-spread{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;border-radius:5px;overflow:hidden;opacity:0;pointer-events:none;
    box-shadow:0 40px 110px -28px rgba(0,0,0,.85);}
  .fb-spread.show{opacity:1;pointer-events:auto;animation:fbSpreadIn .8s var(--ease) both;}
  @keyframes fbSpreadIn{0%{opacity:0;transform:rotateX(16deg) scale(.86);}100%{opacity:1;transform:rotateX(0) scale(1);}}
  .fb-pg{padding:clamp(1.2rem,3vw,2rem);overflow:auto;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(120deg,#e9dcbd,#ded0ad);color:#3a2c1a;font-family:var(--font-narrator,Georgia,serif);text-align:center;}
  .fb-pg.left{box-shadow:inset -24px 0 42px -26px rgba(80,55,20,.7);}
  .fb-pg.right{box-shadow:inset 24px 0 42px -26px rgba(80,55,20,.7);background:linear-gradient(240deg,#e9dcbd,#ded0ad);}
  .fb-pg.turning{animation:fbTurn .5s var(--ease);}
  @keyframes fbTurn{0%{opacity:.4;transform:translateX(6px);}100%{opacity:1;transform:translateX(0);}}
  .fb-gutter{position:absolute;left:50%;top:0;bottom:0;width:2px;transform:translateX(-50%);background:rgba(80,55,20,.32);pointer-events:none;}
  .fb-dedication{font-style:italic;font-size:1.15rem;line-height:1.6;color:#5a4526;}
  .fb-half{display:block;font-family:var(--font-architect,serif);font-size:clamp(1.5rem,4vw,2.2rem);line-height:1.05;color:#33261a;}
  .fb-by-r,.fb-half + .fb-by{color:#7a5a24;}
  .fb-pull{font-family:var(--font-architect,serif);font-size:clamp(1.2rem,3vw,1.7rem);line-height:1.35;color:#3a2c1a;}
  .fb-toc-h{display:block;font-family:var(--font-machine,monospace);font-size:.56rem;letter-spacing:.3em;text-transform:uppercase;color:#8a6a2e;margin-bottom:.9rem;}
  .fb-toc{font-family:var(--font-architect,serif);font-size:1.15rem;line-height:1.9;color:#4a3a22;}
  .fb-first{font-size:1rem;line-height:1.8;color:#3a2c1a;text-align:left;} .fb-first.fb-muted{color:#6a5836;}
  .fb-nav{position:absolute;top:0;bottom:0;width:16%;z-index:3;cursor:pointer;background:transparent;border:none;color:#5a4526;font-size:1.6rem;opacity:0;transition:opacity .3s;display:grid;place-items:center;}
  .fb-spread.show .fb-nav{opacity:.0;} .fb-spread.show:hover .fb-nav{opacity:.5;} .fb-nav:hover{opacity:1!important;}
  .fb-nav.prev{left:0;} .fb-nav.next{right:0;}
  .fb-pager{position:absolute;bottom:.5rem;left:0;right:0;text-align:center;font-family:var(--font-machine,monospace);font-size:.5rem;letter-spacing:.2em;color:rgba(90,69,38,.6);z-index:3;pointer-events:none;}
  .fb-foot{display:flex;flex-direction:column;align-items:center;gap:.5rem;}

    var ci=document.getElementById('hbcimg'); if(ci){ ci.onerror=function(){ var c=document.querySelector('.hb-cover'); ci.remove(); if(c) c.innerHTML='<div class="hb-cover-css"><span class="fb-crescent">\u263D</span><span class="fb-title">'+item.title+'</span><span class="fb-by">'+item.author+'</span></div>'; }; }
    // the pages: a title page, then the preview spreads
    var titlePage={ l:'<span class="hb-crest">'+CREST_SVG+'</span>',
      r:'<span class="hb-tp-title">'+item.title+'</span>'+(item.tagline?'<span class="hb-tp-sub">'+item.tagline+'</span>':'')+'<span class="hb-tp-orn">\u2726</span><span class="hb-tp-kind">A House Book</span><span class="hb-tp-by">by</span><span class="hb-tp-pen">'+((item.pen?item.pen.replace(/^writing as\s*/i,''):item.author)||'').toUpperCase()+'</span>' };
    var pages=[titlePage].concat(item.spread||[]);
    var pg=0, L=document.getElementById('hbL'), R=document.getElementById('hbR'), pager=document.getElementById('hbpager'),
        prev=document.getElementById('hbprev'), next=document.getElementById('hbnext');
    function draw(){ var s=pages[pg]; L.innerHTML=s.l; R.innerHTML=s.r; L.classList.remove('turning'); R.classList.remove('turning'); void L.offsetWidth; L.classList.add('turning'); R.classList.add('turning'); pager.textContent=(pg+1)+' / '+pages.length; prev.style.visibility=pg?'visible':'hidden'; next.style.visibility=(pg<pages.length-1)?'visible':'hidden'; }
    function go(d){ var n=pg+d; if(n>=0&&n<pages.length){ pg=n; draw(); } }
    prev.onclick=function(e){ e.stopPropagation(); go(-1); }; next.onclick=function(e){ e.stopPropagation(); go(1); };
    L.onclick=function(){ go(-1); }; R.onclick=function(){ go(1); }; // click a page to turn it, like a real book
    function openRead(){ document.getElementById('hbcoverstage').style.display='none'; document.getElementById('hbreadstage').style.display='block'; pg=0; draw(); }
    document.getElementById('hbread').onclick=openRead;
    document.getElementById('hbreturn').onclick=close;
    document.getElementById('hbclose').onclick=close;
    document.getElementById('hbback').onclick=close;
    var buy1=document.getElementById('hbbuy'), buy2=document.getElementById('hbbuy2');
    function purchase(){ purchaseBook(item); }
    if(buy1) buy1.onclick=purchase; if(buy2) buy2.onclick=purchase;
  }
  function purchaseBook(item){
    if(!item.href){ toast(item.soon||'The shop opens soon.'); return; }
    try{ window.open(item.href,'_blank'); }catch(e){}
    // The House remembers what you own — mark it so the book simply opens next time.
    keep({id:'book-'+item.slug, title:item.title, kind:'Book', zone:'Luna’s shelves'});
    houseReacts(); toast(item.returned||'The House remembers what you brought home.');
    var buy1=document.getElementById('hbbuy'); if(buy1) buy1.remove();
    var read1=document.getElementById('hbread'); if(read1) read1.textContent='Continue Reading';
    var buy2=document.getElementById('hbbuy2'); if(buy2) buy2.remove();
  }
  function spawnParticles(rar){ avp.innerHTML=''; var n=rar==='legendary'?30:(rar==='rare'?16:(rar==='uncommon'?8:0));
    for(var i=0;i<n;i++){ var p=document.createElement('span'); p.className='p'; p.style.left=(6+Math.random()*88).toFixed(1)+'%'; p.style.top=(30+Math.random()*60).toFixed(1)+'%'; p.style.animationDuration=(4+Math.random()*5).toFixed(1)+'s'; p.style.animationDelay=(-Math.random()*5).toFixed(1)+'s'; avp.appendChild(p); } }
  function houseReacts(){ hnl.textContent='The House notices.'; hn.classList.remove('go'); hnl.classList.remove('go'); void hn.offsetWidth; hn.classList.add('go'); hnl.classList.add('go'); }
  av.addEventListener('click',function(e){ if(e.target===av||e.target.classList.contains('av-veil')) close(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') close(); });
  var tt; function toast(msg){ toastEl.textContent=msg; toastEl.classList.add('show'); clearTimeout(tt); tt=setTimeout(function(){ toastEl.classList.remove('show'); },2600); }

  // dust + parallax
  var dust=document.getElementById('dust');
  for(var i=0;i<(reduce?8:24);i++){ var m=document.createElement('span'); m.className='mote';
    m.style.left=(4+Math.random()*92).toFixed(1)+'%'; m.style.top=(10+Math.random()*80).toFixed(1)+'%';
    if(reduce){ m.style.opacity='0.35'; } else { m.style.setProperty('--dx',(Math.random()*8-4).toFixed(0)+'px'); m.style.animation='rise '+(7+Math.random()*7).toFixed(1)+'s linear '+(-Math.random()*12).toFixed(1)+'s infinite'; } dust.appendChild(m); }
  var parallaxOff=false;
  if(!reduce && !touch && !ZONE.baked){ addEventListener('mousemove',function(e){ if(parallaxOff||dwelling||moving) return; var px=(e.clientX/innerWidth-.5),py=(e.clientY/innerHeight-.5); env.style.transition='transform .3s var(--ease)'; env.style.transform='translate(calc(-50% + '+(-px*10).toFixed(1)+'px), calc(-50% + '+(-py*7).toFixed(1)+'px))'; },{passive:true}); }
  // touch: drag the camera to look around the room; a still tap reaches objects
  if(touch){
    var hintEl=document.querySelector('.hint'); if(hintEl) hintEl.textContent='Drag to look around · tap once to reveal, twice to touch';
    var panX=0, sx=0, spn=0, drag=false, zn=document.getElementById('zone');
    function maxPan(){ var w=env.getBoundingClientRect().width; return Math.max(0,(w-innerWidth)/2); }
    zn.addEventListener('touchstart',function(e){ if(e.touches.length!==1||moving||dwelling||av.classList.contains('open')) return; sx=e.touches[0].clientX; spn=panX; drag=false; },{passive:true});
    zn.addEventListener('touchmove',function(e){ if(e.touches.length!==1||moving||dwelling||av.classList.contains('open')) return; var dx=e.touches[0].clientX-sx; if(Math.abs(dx)>8) drag=true; if(drag){ var mp=maxPan(); panX=Math.max(-mp,Math.min(mp,spn+dx)); env.style.transition='none'; env.style.transform='translate(calc(-50% + '+panX.toFixed(0)+'px),-50%)'; } },{passive:true});
    zn.addEventListener('touchend',function(){ if(drag){ suppressClick=true; setTimeout(function(){ suppressClick=false; },350); } },{passive:true});
  }
  houseSync();
  // re-sync the moment auth state changes (covers first signup, where the session
  // arrives a few seconds AFTER page load, via the Receive-Your-Key ceremony)
  if(sb && sb.auth && sb.auth.onAuthStateChange){ sb.auth.onAuthStateChange(function(ev, session){ if(session) houseSync(); }); }
  if(ZONE.intro){ buildIntro(); }
})();
</script>
