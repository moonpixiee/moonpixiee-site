<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>The Machine Room · House of Luna</title>
<link rel="stylesheet" href="/styles/tokens.css"/>
<style>
  /* ============================================================
     THE MACHINE ROOM — the walkable PARENT room (continuity build, 9 Aug 2026).
     You entered through the Machine Door; you are standing IN the workshop. Five
     machine doors are built into the left wall (AI Luna · Muse · Brand Engine ·
     Creator OS · VELVET//CTRL); the great crimson VAULT on the far wall leads to
     the stone stair down to the Observatory. /tools is no longer a page — this is
     the page. Crimson + bronze identity throughout. Human eye-level.
     ============================================================ */
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:#0a0406;overflow:hidden;}
  .room{position:fixed;inset:0;overflow:hidden;background:#0a0406;}
  .env{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:102vw;aspect-ratio:1536/1024;will-change:transform;
    transition:transform .6s cubic-bezier(.22,1,.36,1);}
  .env img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
  .fx{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;}
  .lantern{position:absolute;transform:translate(-50%,-50%);border-radius:50%;
    background:radial-gradient(circle at 50% 50%, rgba(226,70,66,.42) 0%, rgba(200,50,50,.16) 42%, transparent 74%);}
  @keyframes flick{0%,100%{opacity:.9;}42%{opacity:.7;}66%{opacity:1;}84%{opacity:.8;}}
  .lantern.anim{animation:flick calc(3s + var(--d,0s)) ease-in-out infinite;}
  .mote{position:absolute;width:2px;height:2px;border-radius:50%;background:radial-gradient(circle, rgba(240,150,120,.8), rgba(240,150,120,0));mix-blend-mode:screen;}
  @keyframes rise{0%{transform:translateY(0);opacity:0;}12%{opacity:.6;}80%{opacity:.4;}100%{transform:translateY(-110px) translateX(var(--dx,4px));opacity:0;}}

  /* a MACHINE door in the wall — hover names it in crimson */
  .machine{position:absolute;transform:translate(-50%,-50%);display:block;text-decoration:none;color:transparent;z-index:3;cursor:pointer;outline:none;}
  .machine .mglow{position:absolute;inset:-18% -14%;border-radius:46% 46% 8% 8%/40% 40% 6% 6%;pointer-events:none;mix-blend-mode:screen;
    background:radial-gradient(54% 60% at 50% 46%, rgba(226,74,70,.55) 0%, rgba(226,74,70,.2) 46%, transparent 74%);
    opacity:calc(.1 + .9*var(--w,0));transition:opacity .5s ease;}
  .machine .mname{position:absolute;left:50%;top:-14%;transform:translateX(-50%);white-space:nowrap;
    font-family:var(--font-architect,'Cormorant Garamond',serif);font-variant:small-caps;letter-spacing:.12em;
    font-size:clamp(.72rem,1.3vw,1.02rem);color:rgba(244,214,200,.96);opacity:var(--w,0);transition:opacity .4s ease;
    text-shadow:0 1px 4px rgba(0,0,0,.9), 0 0 14px rgba(226,74,70,.7);pointer-events:none;}
  .machine .mname small{display:block;font-variant:normal;font-family:var(--font-machine,monospace);font-size:.6em;letter-spacing:.18em;color:rgba(226,120,110,.85);}
  .machine:focus-visible{box-shadow:0 0 0 3px rgba(227,163,74,.7);border-radius:6px;}

  /* the VAULT — leads to the stair down */
  .vault{position:absolute;left:68%;top:42%;width:21%;height:50%;transform:translate(-50%,-50%);display:block;text-decoration:none;color:transparent;border-radius:50%;z-index:3;cursor:pointer;outline:none;}
  .vault .halo{position:absolute;inset:-14% -18%;border-radius:50%;pointer-events:none;mix-blend-mode:screen;
    background:radial-gradient(circle at 50% 48%, rgba(226,42,58,.4) 0%, rgba(150,24,40,.15) 48%, transparent 72%);
    opacity:calc(.66 + .5*var(--w,0));transform:scale(calc(1 + .05*var(--w,0)));transition:opacity .6s ease, transform .6s ease;animation:vpulse 5s ease-in-out infinite;}
  @keyframes vpulse{0%,100%{filter:brightness(.92);}50%{filter:brightness(1.12);}}
  .vault .vcue{position:absolute;left:50%;bottom:-7%;transform:translateX(-50%);font-family:var(--font-machine,monospace);font-size:.6rem;letter-spacing:.28em;text-transform:uppercase;color:rgba(240,180,170,.9);white-space:nowrap;opacity:var(--w,0);transition:opacity .5s ease;text-shadow:0 0 12px rgba(226,42,58,.7);}
  .vault:focus-visible{box-shadow:0 0 0 3px rgba(227,163,74,.7);border-radius:50%;}

  .return{position:fixed;top:clamp(1rem,3vw,1.7rem);left:clamp(1rem,3.4vw,2rem);z-index:6;font-family:var(--font-architect,'Cormorant Garamond',serif);font-variant:small-caps;letter-spacing:.12em;font-size:clamp(.82rem,1.5vw,1.05rem);color:rgba(226,150,120,.82);text-decoration:none;text-shadow:0 1px 5px rgba(0,0,0,.9);transition:color .3s;}
  .return:hover{color:#F2C0A4;}
  .fade{position:fixed;inset:0;z-index:30;background:#000;pointer-events:none;animation:fadeout 1.6s ease .1s both;}
  @keyframes fadeout{from{opacity:1;}to{opacity:0;}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;} .fade{display:none;}}
</style>
<link rel="stylesheet" href="/styles/house-artifacts.css"/>
</head>
<body>
  <div class="room" id="room">
    <div class="env" id="env">
      <img src="/assets/machineroom-env.png" alt="The Machine Room — a crimson-lit workshop, five machine doors in the wall and a great vault door on the far wall"/>
      <span class="fx" id="fx"></span>
    </div>
  </div>
  <a class="return" href="/machine-door" aria-label="Back to the Machine Room door">&larr; The Machine Room door</a>
  <div class="fade" aria-hidden="true"></div>

<script>
  var still=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var env=document.getElementById('env'), fx=document.getElementById('fx');
  // the five machines as doors in the left wall (front → back). VELVET is the only
  // one built (its wing is live); the rest name themselves and wait.
  var MACHINES=[
    {name:'AI Luna',      note:'Online',        x:5,  y:48, w:10, h:34, href:''},
    {name:'Muse',         note:'Private Alpha', x:19, y:45, w:8,  h:28, href:''},
    {name:'Brand Engine', note:'In Development', x:32, y:46, w:7,  h:25, href:''},
    {name:'Creator OS',   note:'In Development', x:43, y:47, w:6,  h:22, href:''},
    {name:'VELVET//CTRL', note:'Restricted',    x:51, y:48, w:5,  h:19, href:'/velvet'}
  ];
  // lantern flickers along the wall
  [[3,25],[19,28],[32,30],[43,32],[88,30],[95,52]].forEach(function(p,i){
    var l=document.createElement('span'); l.className='lantern'+(still?'':' anim');
    l.style.left=p[0]+'%'; l.style.top=p[1]+'%'; l.style.width=(6-i*0.3)+'%'; l.style.height=(9-i*0.5)+'%'; l.style.setProperty('--d',(i*0.4)+'s'); fx.appendChild(l);
  });
  for(var i=0;i<(still?8:22);i++){var m=document.createElement('span');m.className='mote';
    m.style.left=(4+Math.random()*92).toFixed(1)+'%';m.style.top=(30+Math.random()*44).toFixed(1)+'%';
    if(still){m.style.opacity='0.3';}else{m.style.setProperty('--dx',(Math.random()*10-5).toFixed(0)+'px');m.style.animation='rise '+(6+Math.random()*6).toFixed(1)+'s linear '+(-Math.random()*10).toFixed(1)+'s infinite';}
    fx.appendChild(m);}
  var els=[];
  MACHINES.forEach(function(mc){
    var el=document.createElement(mc.href?'a':'div'); el.className='machine';
    if(mc.href){ el.href=mc.href; el.setAttribute('aria-label','Enter '+mc.name); } else { el.setAttribute('aria-label',mc.name+' — '+mc.note); }
    el.style.left=mc.x+'%'; el.style.top=mc.y+'%'; el.style.width=mc.w+'%'; el.style.height=mc.h+'%';
    el.innerHTML='<span class="mglow"></span><span class="mname">'+mc.name+'<small>'+mc.note+'</small></span>';
    env.appendChild(el); els.push({el:el,d:mc});
  });
  var vault=document.createElement('a'); vault.className='vault'; vault.href='/machinestair.html'; vault.setAttribute('aria-label','The vault — descend the stair to the Observatory');
  vault.innerHTML='<span class="halo"></span><span class="vcue">The Vault &middot; Descend &darr;</span>';
  env.appendChild(vault); els.push({el:vault,d:{x:68,y:42,w:21,h:50}});
  if(!still){
    window.addEventListener('mousemove',function(e){
      var r=env.getBoundingClientRect();
      var nx=(e.clientX-r.left)/r.width*100, ny=(e.clientY-r.top)/r.height*100;
      els.forEach(function(o){ var dx=(nx-o.d.x)/(o.d.w*1.1||8), dy=(ny-o.d.y)/(o.d.h*1.1||30); var w=Math.max(0,Math.min(1,1-Math.hypot(dx,dy))); o.el.style.setProperty('--w',w.toFixed(3)); });
      var px=((e.clientX/window.innerWidth)-0.5), py=((e.clientY/window.innerHeight)-0.5);
      env.style.transform='translate(calc(-50% + '+(-px*10).toFixed(1)+'px), calc(-50% + '+(-py*7).toFixed(1)+'px))';
    },{passive:true});
    document.addEventListener('mouseleave',function(){els.forEach(function(o){o.el.style.setProperty('--w','0');});env.style.transform='translate(-50%,-50%)';});
  }
</script>
</body>
</html>
