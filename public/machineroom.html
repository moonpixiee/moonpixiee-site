<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>The Machine Room · House of Luna</title>
<link rel="stylesheet" href="/styles/tokens.css"/>
<style>
  /* ============================================================
     THE MACHINE ROOM — you walk INTO the room. The photoreal environment fills
     the viewport; interaction is composited on the architecture (north star:
     art = world, HTML = interaction; "would this feel believable if you were
     walking through it?"). The wall lanterns breathe, the great crimson VAULT
     DOOR pulses and wakes as you approach — it is the way DEEPER, toward the
     hidden stair to the Observatory. Dust drifts; the room parallaxes as you look.
     ============================================================ */
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:#070506;overflow:hidden;}
  body{cursor:default;}
  .room{position:fixed;inset:0;overflow:hidden;background:#070506;}

  /* the environment, sized to COVER the viewport (3:1), with parallax overscan */
  .env{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:max(108vw, 324vh);aspect-ratio:1536/512;will-change:transform;
    transition:transform .6s cubic-bezier(.22,1,.36,1);}
  .env img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}

  .fx{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;}
  .fx>span{position:absolute;transform:translate(-50%,-50%);}
  .lg{border-radius:50%;
    background:radial-gradient(circle at 50% 50%, rgba(255,206,130,.5) 0%, rgba(240,168,70,.22) 36%, rgba(230,150,60,.07) 60%, transparent 78%);}
  @keyframes flick{0%,100%{opacity:.9;}40%{opacity:.72;}62%{opacity:.98;}82%{opacity:.8;}}
  .lg{animation:flick calc(3s + var(--d,0s)) ease-in-out infinite;}
  /* the engine's red heartbeat */
  .engine{width:16%;height:34%;
    background:radial-gradient(circle at 50% 50%, rgba(220,60,64,.32) 0%, rgba(180,40,50,.12) 44%, transparent 72%);
    animation:pulse 4.2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.7;}50%{opacity:1;}}

  /* the VAULT DOOR — crimson, pulsing; the hotspot that leads DEEPER. Wakes on approach. */
  .vault{position:absolute;left:67%;top:44%;width:24%;height:74%;transform:translate(-50%,-50%);
    display:block;text-decoration:none;color:transparent;border-radius:50%;z-index:3;cursor:pointer;outline:none;}
  .vault .halo{position:absolute;inset:-18% -30%;border-radius:50%;pointer-events:none;mix-blend-mode:screen;
    background:radial-gradient(circle at 50% 48%, rgba(226,42,58,.42) 0%, rgba(150,24,40,.16) 46%, transparent 72%);
    opacity:calc(.7 + .5*var(--w,0));transform:scale(calc(1 + .06*var(--w,0)));
    transition:opacity .7s ease, transform .7s ease;animation:pulse 5s ease-in-out infinite;}
  .vault:focus-visible{box-shadow:0 0 0 3px rgba(227,163,74,.7);border-radius:50%;}
  /* a quiet cue that appears on approach: "deeper" */
  .vault .cue{position:absolute;left:50%;bottom:-8%;transform:translateX(-50%);
    font-family:var(--font-machine,monospace);font-size:.62rem;letter-spacing:.28em;text-transform:uppercase;
    color:rgba(233,196,180,.86);white-space:nowrap;mix-blend-mode:normal;
    opacity:var(--w,0);transition:opacity .5s ease;text-shadow:0 0 12px rgba(226,42,58,.7);}

  .mote{position:absolute;width:2px;height:2px;border-radius:50%;
    background:radial-gradient(circle, rgba(255,224,160,.85), rgba(255,224,160,0));mix-blend-mode:screen;}
  @keyframes rise{0%{transform:translateY(0) translateX(0);opacity:0;}12%{opacity:.7;}80%{opacity:.45;}100%{transform:translateY(-110px) translateX(var(--dx,4px));opacity:0;}}

  /* the DESCENT — the vault opens onto a stair down into the dark, toward the Observatory */
  .descend{position:fixed;inset:0;z-index:30;pointer-events:none;transform:translateY(100%);
    background:linear-gradient(180deg,#0b0406 0%,#050203 60%,#000 100%);
    display:grid;place-items:center;}
  .descend.go{transition:transform 1.1s cubic-bezier(.5,0,.2,1);transform:translateY(0);pointer-events:auto;}
  .descend p{font-family:var(--font-machine,monospace);font-size:.7rem;letter-spacing:.34em;text-transform:uppercase;
    color:rgba(226,120,110,.85);opacity:0;transition:opacity .6s ease .5s;text-shadow:0 0 16px rgba(226,42,58,.6);}
  .descend.go p{opacity:1;}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;} .descend.go{transform:translateY(0);}}
</style>
</head>
<body>
  <div class="room" id="room">
    <div class="env" id="env">
      <img src="/assets/machineroom-env.png" alt="The Machine Room — a vaulted workshop beneath the House, brass machinery and a great crimson vault door"/>
      <span class="fx" id="fx">
        <span class="lg" style="left:12%;top:26%;width:9%;height:22%;--d:.4s"></span>
        <span class="lg" style="left:20.5%;top:20%;width:7%;height:18%;--d:1.1s"></span>
        <span class="lg" style="left:47%;top:44%;width:6%;height:16%;--d:.7s"></span>
        <span class="lg" style="left:87.5%;top:25%;width:8%;height:20%;--d:1.6s"></span>
        <span class="lg" style="left:96.5%;top:53%;width:7%;height:18%;--d:.2s"></span>
        <span class="engine" style="left:36%;top:50%"></span>
        <span class="dust" id="dust" style="left:0;top:0;transform:none;width:100%;height:100%"></span>
      </span>
      <a class="vault" href="/observatory.html" aria-label="The vault — descend the stair toward the Observatory" id="vault">
        <span class="halo"></span>
        <span class="cue">Deeper &darr;</span>
      </a>
    </div>
  </div>
  <div class="descend" id="descend" aria-hidden="true"><p>Descending the stair&hellip;</p></div>

<script>
  var still=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var env=document.getElementById('env'), dust=document.getElementById('dust'), vault=document.getElementById('vault');
  // dust near the lanterns + vault
  var zones=[{x:20,y:24,s:18},{x:67,y:40,s:22},{x:88,y:30,s:16}];
  for(var i=0;i<(still?8:26);i++){var z=zones[i%3],m=document.createElement('span');m.className='mote';
    m.style.left=(z.x+(Math.random()*z.s-z.s/2)).toFixed(1)+'%';m.style.top=(z.y+(Math.random()*z.s-z.s/2)).toFixed(1)+'%';
    if(still){m.style.opacity='0.35';}else{m.style.setProperty('--dx',(Math.random()*10-5).toFixed(0)+'px');m.style.animation='rise '+(6+Math.random()*6).toFixed(1)+'s linear '+(-Math.random()*10).toFixed(1)+'s infinite';}
    dust.appendChild(m);}
  if(!still){
    var VCX=0.67, VCY=0.44;
    window.addEventListener('mousemove',function(e){
      var r=env.getBoundingClientRect();
      var nx=(e.clientX-r.left)/r.width, ny=(e.clientY-r.top)/r.height;
      var w=Math.max(0,Math.min(1,1-Math.hypot(nx-VCX,ny-VCY)/0.28));
      vault.style.setProperty('--w', w.toFixed(3));
      var px=((e.clientX/window.innerWidth)-0.5), py=((e.clientY/window.innerHeight)-0.5);
      env.style.transform='translate(calc(-50% + '+(-px*22).toFixed(1)+'px), calc(-50% + '+(-py*14).toFixed(1)+'px))';
    },{passive:true});
    document.addEventListener('mouseleave',function(){vault.style.setProperty('--w','0');env.style.transform='translate(-50%,-50%)';});
  }
  // the vault descends: play the stair transition, then arrive in the Observatory
  vault.addEventListener('click',function(ev){
    if(ev.metaKey||ev.ctrlKey||ev.shiftKey||ev.button) return;
    ev.preventDefault();
    var d=document.getElementById('descend'); var href=vault.getAttribute('href');
    if(still){ window.location.href=href; return; }
    d.classList.add('go'); env.style.transform='translate(-50%,-46%)';
    setTimeout(function(){ window.location.href=href; }, 1150);
  });
</script>
</body>
</html>
