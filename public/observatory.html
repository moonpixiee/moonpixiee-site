<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>The Observatory · House of Luna</title>
<link rel="stylesheet" href="/styles/tokens.css"/>
<style>
  /* THE OBSERVATORY — the oldest, stillest room in the House (continuity build,
     9 Aug 2026). You arrive from the moon tunnel into a great gothic dome: the
     armillary beneath the stars, moonlight through the glass, marble, silence.
     Tuned per Luna: darker, moonlight stronger, fewer warm lanterns, stars
     brighter, almost church-like. The Machine Room is alive; this room is STILL. */
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:#04060c;overflow:hidden;}
  .room{position:fixed;inset:0;overflow:hidden;background:#04060c;}
  .env{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:102vw;aspect-ratio:1536/1024;will-change:transform;
    transition:transform 1s cubic-bezier(.22,1,.36,1);}
  .env img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
  /* 20% darker + focus on the armillary (stillness, church-like) */
  .grade{position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(120% 100% at 50% 46%, transparent 34%, rgba(3,5,11,.5) 80%, rgba(3,5,11,.8) 100%),
      linear-gradient(180deg, rgba(4,6,14,.28) 0%, transparent 26%);}
  .fx{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;}
  .fx>span{position:absolute;transform:translate(-50%,-50%);}
  /* the moon through the dome — strong, cool */
  .moon{left:52%;top:11%;width:15%;height:36%;background:radial-gradient(circle at 50% 44%, rgba(206,216,255,.55) 0%, rgba(150,170,240,.2) 42%, transparent 72%);}
  /* cold window/glass glow — the moonlight in the glass; slow, still breathing */
  .cw{border-radius:40% 40% 16% 16%/56% 56% 18% 18%;
    background:radial-gradient(circle at 50% 42%, rgba(150,175,235,.3) 0%, rgba(110,130,215,.12) 46%, transparent 76%);}
  @keyframes breathe{0%,100%{opacity:.66;}50%{opacity:.92;}}
  .cw{animation:breathe calc(9s + var(--d,0s)) ease-in-out infinite;}
  /* stars — faint twinkles across the dome + glass */
  .star{position:absolute;width:1.6px;height:1.6px;border-radius:50%;background:rgba(226,232,255,.95);mix-blend-mode:screen;}
  @keyframes tw{0%,100%{opacity:.25;}50%{opacity:.95;}}
  /* only a FEW warm lanterns, dim (fewer than before) */
  .bw{border-radius:50%;background:radial-gradient(circle at 50% 50%, rgba(232,196,120,.3) 0%, rgba(210,150,70,.1) 46%, transparent 74%);animation:breathe calc(6s + var(--d,0s)) ease-in-out infinite;}
  /* a faint gold breath on the brass armillary */
  .arm{left:50%;top:47%;width:20%;height:34%;background:radial-gradient(circle at 50% 50%, rgba(224,190,120,.16) 0%, rgba(190,150,80,.06) 50%, transparent 76%);animation:breathe 10s ease-in-out infinite;}
  .mote{position:absolute;width:1.6px;height:1.6px;border-radius:50%;background:radial-gradient(circle, rgba(206,214,255,.8), rgba(206,214,255,0));mix-blend-mode:screen;}
  @keyframes drift{0%{transform:translateY(0);opacity:0;}14%{opacity:.55;}84%{opacity:.35;}100%{transform:translateY(-100px) translateX(var(--dx,3px));opacity:0;}}

  .ascend{position:fixed;top:clamp(1rem,3vw,1.7rem);left:clamp(1rem,3.4vw,2rem);z-index:6;font-family:var(--font-architect,'Cormorant Garamond',serif);font-variant:small-caps;letter-spacing:.12em;font-size:clamp(.82rem,1.5vw,1.05rem);color:rgba(200,210,240,.7);text-decoration:none;text-shadow:0 1px 5px rgba(0,0,0,.9);transition:color .3s;}
  .ascend:hover{color:#D8E0F8;}
  /* you arrive out of the tunnel's darkness — a gentle rise, not a hard cut */
  .arrive{position:fixed;inset:0;z-index:20;background:#05070f;pointer-events:none;animation:arriveOut 2.2s cubic-bezier(.22,1,.36,1) forwards;}
  @keyframes arriveOut{0%{opacity:1;}100%{opacity:0;}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;} .arrive{display:none;}}
</style>
</head>
<body>
  <div class="room" id="room">
    <div class="env" id="env">
      <img src="/assets/observatory-env.png" alt="The Observatory — a great gothic dome, the brass armillary beneath the stars, moonlight through the glass"/>
      <span class="grade" aria-hidden="true"></span>
      <span class="fx" id="fx">
        <span class="moon"></span>
        <span class="cw" style="left:11%;top:34%;width:9%;height:40%;--d:.6s"></span>
        <span class="cw" style="left:31%;top:30%;width:9%;height:40%;--d:1.6s"></span>
        <span class="cw" style="left:69%;top:30%;width:9%;height:40%;--d:1.1s"></span>
        <span class="cw" style="left:89%;top:34%;width:9%;height:40%;--d:.3s"></span>
        <span class="arm"></span>
        <span class="bw" style="left:13%;top:78%;width:5%;height:12%;--d:.5s"></span>
        <span class="bw" style="left:88%;top:80%;width:5%;height:12%;--d:1.3s"></span>
        <span class="dust" id="dust" style="left:0;top:0;transform:none;width:100%;height:100%"></span>
      </span>
    </div>
  </div>
  <a class="ascend" href="/machineroom.html" aria-label="Ascend to the Machine Room">&uarr; Ascend</a>
  <div class="arrive" aria-hidden="true"></div>

<script>
  var still=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var env=document.getElementById('env'), dust=document.getElementById('dust'), fx=document.getElementById('fx');
  // brighter stars, scattered across the dome + upper glass
  for(var i=0;i<(still?14:40);i++){var s=document.createElement('span');s.className='star';
    s.style.left=(6+Math.random()*88).toFixed(1)+'%';s.style.top=(4+Math.random()*40).toFixed(1)+'%';
    if(still){s.style.opacity='0.6';}else{s.style.animation='tw '+(2.5+Math.random()*4).toFixed(1)+'s ease-in-out '+(-Math.random()*5).toFixed(1)+'s infinite';}
    fx.appendChild(s);}
  for(var i=0;i<(still?8:20);i++){var m=document.createElement('span');m.className='mote';
    m.style.left=(10+Math.random()*80).toFixed(1)+'%';m.style.top=(40+Math.random()*44).toFixed(1)+'%';
    if(still){m.style.opacity='0.3';}else{m.style.setProperty('--dx',(Math.random()*8-4).toFixed(0)+'px');m.style.animation='drift '+(9+Math.random()*7).toFixed(1)+'s linear '+(-Math.random()*12).toFixed(1)+'s infinite';}
    dust.appendChild(m);}
  if(!still){
    window.addEventListener('mousemove',function(e){
      var px=((e.clientX/window.innerWidth)-0.5), py=((e.clientY/window.innerHeight)-0.5);
      env.style.transform='translate(calc(-50% + '+(-px*12).toFixed(1)+'px), calc(-50% + '+(-py*8).toFixed(1)+'px))';
    },{passive:true});
    document.addEventListener('mouseleave',function(){env.style.transform='translate(-50%,-50%)';});
  }
</script>
</body>
</html>
