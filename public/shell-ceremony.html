<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your First Night · House of Luna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Allura&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --ink:#efe7d8; --ink-soft:#c9bda6; --ink-dim:#8c8371;
  --brass:#c9b47a; --brass-deep:#9c8850; --brass-glow:#e6cf94;
  --candle:#e8b06a;
  --serif:'Cormorant Garamond',Georgia,serif;
  --title:'Cinzel',Georgia,serif; --hand:'Allura',cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#050408; color:var(--ink); font-family:var(--serif);
  overflow:hidden; -webkit-font-smoothing:antialiased; user-select:none}
#sky{position:fixed; inset:0; background:radial-gradient(120% 90% at 50% 12%,#140f1a 0%,#0a0710 46%,#050408 100%)}
#sky::after{content:""; position:absolute; inset:0; opacity:.5;
  background-image:radial-gradient(rgba(255,255,255,.03) 1px,transparent 1px); background-size:5px 5px}

/* ---- candle ---- */
#candle{position:fixed; left:50%; bottom:9%; transform:translateX(-50%); text-align:center; z-index:3;
  transition:opacity 1.4s ease, transform 1.4s ease}
#candle .flame{font-size:30px; filter:drop-shadow(0 0 18px rgba(232,176,106,.8)); animation:flick 2.6s ease-in-out infinite}
@keyframes flick{0%,100%{transform:translateY(0) rotate(-1deg);opacity:.95}50%{transform:translateY(-1px) rotate(1.5deg);opacity:1}}
#candle .pool{position:absolute; left:50%; bottom:-10px; width:280px; height:120px; transform:translateX(-50%);
  background:radial-gradient(circle, rgba(232,176,106,.16), transparent 70%); pointer-events:none}

/* ---- keeper voice ---- */
#stagewrap{position:fixed; inset:0; display:grid; place-items:center; z-index:5; padding:24px}
body.choosing #stagewrap{place-items:start center; overflow-y:auto; padding-top:clamp(20px,4vh,44px); padding-bottom:34px}
body.choosing #keeper, body.choosing #namewrap, body.choosing #key{display:none}
.stage{width:min(96vw,960px); text-align:center}
#keeper{min-height:2.6em; margin-bottom:6px}
#keeper .line{display:block; font-family:var(--serif); font-style:italic;
  font-size:clamp(20px,3vw,30px); line-height:1.5; color:var(--ink);
  opacity:0; transform:translateY(10px); transition:opacity 1.1s ease, transform 1.1s ease;
  text-shadow:0 2px 30px #000}
#keeper .line.show{opacity:1; transform:translateY(0)}
#keeper .line.dim{color:var(--ink-soft)}

/* the key */
#key{margin:26px auto 0; font-size:40px; opacity:0; transform:scale(.6) rotate(-18deg);
  filter:drop-shadow(0 0 22px rgba(230,207,148,.7)); transition:all 1.3s cubic-bezier(.2,.9,.2,1)}
#key.show{opacity:1; transform:scale(1) rotate(0)}

/* name entry */
#namewrap{margin-top:30px; opacity:0; transform:translateY(12px); transition:opacity 1s ease, transform 1s ease; pointer-events:none}
#namewrap.show{opacity:1; transform:translateY(0); pointer-events:auto}
#nameInput{font-family:var(--title); font-size:clamp(20px,3vw,30px); letter-spacing:.14em; text-align:center;
  color:var(--brass-glow); background:transparent; border:none; border-bottom:1px solid var(--brass-deep);
  padding:8px 10px 10px; width:min(80vw,420px); outline:none; text-transform:capitalize}
#nameInput::placeholder{color:var(--ink-dim); font-style:italic; letter-spacing:.06em; text-transform:none; font-family:var(--serif)}
#nameHint{margin-top:14px; font-family:var(--serif); font-style:italic; color:var(--ink-dim); font-size:15px}
#nameGo{margin-top:20px}

/* buttons */
.btn{font-family:var(--title); font-size:12px; letter-spacing:.2em; text-transform:uppercase;
  color:var(--ink); background:linear-gradient(180deg,rgba(31,24,17,.9),rgba(18,13,9,.94));
  border:1px solid rgba(201,180,122,.22); border-radius:40px; padding:13px 26px; cursor:pointer;
  transition:all .3s ease}
.btn:hover{border-color:var(--brass); color:var(--brass-glow); transform:translateY(-2px)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.4; cursor:default; transform:none}

/* ---- the question + shells ---- */
#question{opacity:0; transition:opacity 1.1s ease; margin-bottom:6px}
#question.show{opacity:1}
#question .q{font-family:var(--title); font-weight:500; font-size:clamp(22px,3.4vw,34px); letter-spacing:.06em; color:var(--ink)}
#question .sub{font-family:var(--serif); font-style:italic; color:var(--brass); font-size:clamp(15px,1.8vw,18px); margin-top:10px}

#shelves{margin-top:34px; display:grid; grid-template-columns:repeat(4,1fr); gap:16px;
  opacity:0; transform:translateY(16px); transition:opacity 1s ease .2s, transform 1s ease .2s}
#shelves.show{opacity:1; transform:translateY(0)}
@media (max-width:820px){#shelves{grid-template-columns:repeat(2,1fr)}}
.shell{position:relative; border-radius:14px; overflow:hidden; cursor:pointer;
  height:clamp(182px,22vh,248px);
  border:1px solid rgba(201,180,122,.26); box-shadow:0 20px 44px -22px #000, inset 0 1px 0 rgba(255,240,210,.06);
  transition:transform .5s cubic-bezier(.2,.8,.2,1), border-color .4s ease, box-shadow .5s ease}
.shell::after{content:''; position:absolute; inset:0; z-index:2; pointer-events:none;
  background:radial-gradient(90% 55% at 50% 0%, rgba(255,240,210,.09), transparent 62%)}
.shell:hover{transform:translateY(-6px) scale(1.02); border-color:var(--brass);
  box-shadow:0 30px 60px -24px #000, 0 0 40px -16px rgba(230,207,148,.4)}
.shell .scene{position:absolute; inset:0}
.shell .grad{position:absolute; inset:0}
.shell .label{position:absolute; left:0; right:0; bottom:0; padding:44px 14px 14px 14px; z-index:3;
  background:linear-gradient(180deg,transparent,rgba(6,4,10,.86) 62%); text-align:left}
.shell .e{font-size:22px; filter:drop-shadow(0 2px 8px #000)}
.shell .n{font-family:var(--title); font-size:13px; letter-spacing:.08em; color:var(--ink); margin-top:6px}
.shell .f{font-family:var(--serif); font-style:italic; font-size:13.5px; line-height:1.45; color:var(--ink-soft);
  margin-top:5px; max-height:0; opacity:0; overflow:hidden; transition:max-height .5s ease, opacity .5s ease}
.shell:hover .f{max-height:96px; opacity:1}
.shell .win{position:absolute; right:12%; top:12%; width:30%; height:26%; border-radius:3px; z-index:2;
  box-shadow:0 0 0 3px rgba(20,14,9,.9), 0 8px 18px rgba(0,0,0,.5), 0 0 22px -4px rgba(232,200,140,.4)}

/* ---- the room forms ---- */
#formed{position:fixed; inset:0; z-index:8; opacity:0; pointer-events:none; transition:opacity 1.4s ease}
#formed.show{opacity:1; pointer-events:auto}
#formed .room{position:absolute; inset:0}
#formed .wall{position:absolute; inset:0}
#formed .floor{position:absolute; left:0; right:0; bottom:0; height:34%}
#formed .win{position:absolute; left:56%; top:14%; width:26%; height:36%; border-radius:5px; overflow:hidden;
  box-shadow:0 0 0 7px rgba(20,14,9,.95),0 0 0 9px rgba(38,27,17,.9),0 22px 44px -14px #000}
#formed .amb{position:absolute; inset:0; mix-blend-mode:screen; pointer-events:none}
#formed .thing{position:absolute; transform:translate(-50%,-50%); font-size:clamp(20px,3vw,38px);
  filter:drop-shadow(0 6px 12px rgba(0,0,0,.7)); opacity:0; transition:opacity 1s ease}
#formed.things .thing{opacity:1}
#formed .thing .t{position:absolute; top:112%; left:50%; transform:translateX(-50%); white-space:nowrap;
  font-family:var(--title); font-size:9px; letter-spacing:.2em; text-transform:uppercase; color:var(--brass); opacity:.7}

/* the handwritten note */
#note{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) rotate(-2deg); z-index:10;
  width:min(88vw,440px); padding:34px 36px; border-radius:6px; text-align:center;
  background:linear-gradient(180deg,#efe4cf,#e4d6bb); color:#2a2015;
  box-shadow:0 30px 70px -20px #000, 0 2px 0 rgba(255,255,255,.4) inset;
  opacity:0; transition:opacity 1.2s ease .3s, transform 1.2s cubic-bezier(.2,.9,.2,1) .3s}
#note.show{opacity:1; transform:translate(-50%,-52%) rotate(-2deg)}
#note .wh{font-family:var(--hand); font-size:clamp(30px,5vw,46px); line-height:1; color:#3a2a1a}
#note .wr{font-family:var(--hand); font-size:clamp(19px,2.6vw,25px); line-height:1.4; color:#4a3826; margin-top:16px}
#note .seal{position:absolute; left:50%; bottom:-16px; transform:translateX(-50%); font-size:26px;
  filter:drop-shadow(0 3px 6px rgba(0,0,0,.4))}
#stepIn{position:fixed; left:50%; bottom:10%; transform:translateX(-50%); z-index:12;
  opacity:0; pointer-events:none; transition:opacity 1s ease .8s}
#stepIn.show{opacity:1; pointer-events:auto}

#restart{position:fixed; right:18px; top:16px; z-index:20; font-family:var(--title); font-size:10px;
  letter-spacing:.18em; text-transform:uppercase; color:var(--ink-dim); background:transparent;
  border:1px solid rgba(201,180,122,.16); border-radius:30px; padding:8px 14px; cursor:pointer; opacity:.5}
#restart:hover{opacity:1; color:var(--brass)}
#blackout{position:fixed; inset:0; z-index:60; background:#000; opacity:0; pointer-events:none; transition:opacity 1s ease}
#blackout.on{opacity:1}
.plaque{display:inline-block; font-family:var(--title); letter-spacing:.16em; color:#1c1408;
  background:linear-gradient(180deg,#d9c07f,#b2965a); padding:6px 18px; border-radius:4px;
  box-shadow:0 4px 12px rgba(0,0,0,.5), 0 1px 0 rgba(255,255,255,.5) inset; text-transform:uppercase; font-size:13px}
</style>
</head>
<body>
<div id="sky"></div>
<button id="restart">Begin again</button>

<div id="candle"><div class="pool"></div><div class="flame">🕯️</div></div>

<div id="stagewrap"><div class="stage">
  <div id="keeper"></div>

  <div id="key">🗝️</div>

  <div id="namewrap">
    <input id="nameInput" type="text" maxlength="18" placeholder="a name the House will know you by…" autocomplete="off" spellcheck="false">
    <div id="nameHint">Not your real name, unless you want it to be. Juniper. Opal. North. Rook.</div>
    <button class="btn" id="nameGo">Engrave it</button>
  </div>

  <div id="question">
    <div class="q">What kind of room feels most like home?</div>
    <div class="sub">There's no wrong door. The room will learn who you are.</div>
  </div>
  <div id="shelves"></div>
</div></div>

<!-- the room forms -->
<div id="formed">
  <div class="room">
    <div class="wall"></div><div class="floor"></div>
    <div class="win" id="fwin"></div>
    <div class="amb" id="famb"></div>
  </div>
  <div id="note">
    <div class="wh">Welcome home.</div>
    <div class="wr">The rest of the room will learn who you are.</div>
    <div class="seal">🕯️</div>
  </div>
</div>
<button class="btn" id="stepIn">Step inside your room →</button>
<div id="blackout"></div>

<script>
/* =========================================================
   HOUSE OF LUNA · THE SHELL CEREMONY — the First Night
   Faithful to Blueprint 002 (the First Night ritual) and
   Blueprint 003 (the one question → the starting shell).
   The chosen shell becomes the room's ARCHITECTURE layer.
   No avatar for the Keeper — she is voice + evidence only
   (Keeper Bible). The choice would persist to Supabase
   room.shell; here it's carried forward in the URL.
   ========================================================= */

/* ---- the eight shells (order per Blueprint 003) ---- */
const SHELLS=[
  {id:'library-loft', e:'📚', name:'Library Loft', feel:"Books to the ceiling, a ladder, lamplight that never quite reaches the top shelf.",
    reply:"A reader. I thought so.",
    wall:['#2a2016','#150e07'], floor:['#3a2a1a','#1c130a'], amb:'rgba(201,162,74,.20)',
    win:'linear-gradient(180deg,#12141f,#1c2233)', sig:sigShelves('#4a3620','#26180d')},
  {id:'botanical', e:'🌿', name:'Botanical Room', feel:"Green in every corner, rain on the glass, something always growing.",
    reply:"You'll want the rain, then. I'll leave the window cracked.",
    wall:['#15241c','#0b140f'], floor:['#23301f','#111a12'], amb:'rgba(120,180,120,.18)',
    win:'linear-gradient(180deg,#12241c,#1c3327)', sig:sigTrees()},
  {id:'penthouse-studio', e:'🌃', name:'Penthouse Studio', feel:"The city below, the night wide open, and room to make a mess.",
    reply:"Somewhere to make a mess. Good — the best rooms are made, not kept.",
    wall:['#1a1626','#0c0914'], floor:['#241d2e','#120d18'], amb:'rgba(150,120,210,.18)',
    win:'linear-gradient(180deg,#0b1524,#1c2b40)', sig:sigCity()},
  {id:'gothic-chamber', e:'🕯️', name:'Gothic Chamber', feel:"Candlelight, dark wood, velvet — a room that keeps its secrets.",
    reply:"A room that keeps its secrets. So do I.",
    wall:['#20141c','#0e080d'], floor:['#2a1a20','#150b10'], amb:'rgba(232,150,90,.20)',
    win:'radial-gradient(120% 100% at 30% 20%,#241a30,#0a0714 70%)', sig:sigArch()},
  {id:'minimal', e:'☁️', name:'Minimal Apartment', feel:"Quiet, and pale, and clear. Space to breathe before you fill it.",
    reply:"Room to breathe first. We'll fill it slowly.",
    wall:['#2b2c30','#1a1b1f'], floor:['#33342f','#1e1f1b'], amb:'rgba(220,224,230,.12)',
    win:'linear-gradient(180deg,#c9cdd6,#9fa6b2)', sig:''},
  {id:'coastal', e:'🌊', name:'Coastal Room', feel:"Salt in the air, pale light, the sound of water somewhere close.",
    reply:"You miss the water. It'll be there when you wake.",
    wall:['#16282e','#0b1418'], floor:['#20302f','#101a19'], amb:'rgba(130,190,200,.16)',
    win:'linear-gradient(180deg,#173a4d,#1e5a72)', sig:sigHorizon()},
  {id:'cabin', e:'🏔️', name:'Mountain Cabin', feel:"Timber, a low fire, snow at the window, nowhere to be.",
    reply:"Somewhere to be nowhere. I'll keep the fire low.",
    wall:['#241a12','#120b06'], floor:['#2e2015','#160e07'], amb:'rgba(232,140,70,.20)',
    win:'linear-gradient(180deg,#2b2f3d,#3a3f50)', sig:sigTimber()},
  {id:'blank', e:'✨', name:'Blank Canvas', feel:"Nothing yet. Just you, and every direction at once.",
    reply:"Everything at once. Brave. I like that.",
    wall:['#131118','#08070c'], floor:['#191720','#0d0b12'], amb:'rgba(180,170,210,.10)',
    win:'radial-gradient(120% 100% at 40% 30%,#1a1636,#0a0714 70%)', sig:sigSpark()},
];
function sigShelves(a,b){let s='';[10,30,50,70,88].forEach((x,i)=>{const h=40+((i*17)%34);s+=`<div style="position:absolute;bottom:0;left:${x}%;width:9%;height:${h}%;background:linear-gradient(180deg,${a},${b})"></div>`;for(let k=0;k<4;k++){s+=`<div style="position:absolute;bottom:${8+k*10}%;left:${x-1}%;width:11%;height:2px;background:rgba(0,0,0,.4)"></div>`}});s+='<div style="position:absolute;bottom:20%;left:20%;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle,#f0d69a,#c9a24a);box-shadow:0 0 22px rgba(232,200,120,.7)"></div>';return s}
function sigTrees(){let s='';[8,26,46,66,86].forEach((x,i)=>{const h=38+((i*13)%30);s+=`<div style="position:absolute;bottom:0;left:${x}%;width:12%;height:${h}%;background:linear-gradient(180deg,#2c5238,#0e1c14);clip-path:polygon(50% 0,100% 100%,0 100%)"></div>`});return s}
function sigCity(){let s='<div style="position:absolute;top:8%;left:24%;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle,#f3ead2,#c9b47a);box-shadow:0 0 24px rgba(232,220,180,.5)"></div>';[4,20,36,52,68,84].forEach((x,i)=>{const h=28+((i*15)%40);s+=`<div style="position:absolute;bottom:0;left:${x}%;width:13%;height:${h}%;background:linear-gradient(180deg,#241a34,#0f0a18)"></div><div style="position:absolute;bottom:${h*.5}%;left:${x+4}%;width:3%;height:3px;background:rgba(232,200,120,.7);box-shadow:0 0 6px rgba(232,200,120,.7)"></div>`});return s}
function sigArch(){return '<div style="position:absolute;left:50%;top:16%;width:44%;height:70%;transform:translateX(-50%);border:2px solid rgba(120,90,60,.4);border-bottom:none;border-radius:60% 60% 0 0"></div>'+'<div style="position:absolute;left:34%;bottom:22%;font-size:16px;filter:drop-shadow(0 0 12px rgba(232,150,90,.8))">🕯️</div><div style="position:absolute;right:34%;bottom:22%;font-size:16px;filter:drop-shadow(0 0 12px rgba(232,150,90,.8))">🕯️</div>'}
function sigHorizon(){return '<div style="position:absolute;top:44%;left:0;right:0;height:2px;background:rgba(210,235,240,.35)"></div><div style="position:absolute;bottom:0;left:0;right:0;height:56%;background:repeating-linear-gradient(180deg,rgba(255,255,255,.05) 0 2px,transparent 2px 12px)"></div><div style="position:absolute;top:16%;right:22%;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle,#ffe9c2,#e8b06a);box-shadow:0 0 22px rgba(232,176,106,.5)"></div>'}
function sigTimber(){let s='';for(let k=0;k<6;k++){s+=`<div style="position:absolute;top:${k*16}%;left:0;right:0;height:12%;background:linear-gradient(180deg,#3a2818,#26180d);border-bottom:1px solid rgba(0,0,0,.4)"></div>`}s+='<div style="position:absolute;bottom:14%;left:44%;font-size:20px;filter:drop-shadow(0 0 16px rgba(232,120,50,.9))">🔥</div>';return s}
function sigSpark(){let s='';for(let i=0;i<26;i++){const x=(i*53)%100,y=(i*31)%90,o=.2+((i%5)/6);s+=`<div style="position:absolute;left:${x}%;top:${y}%;width:2px;height:2px;border-radius:50%;background:#fff;opacity:${o}"></div>`}s+='<div style="position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);font-size:20px;filter:drop-shadow(0 0 16px rgba(200,180,255,.9))">✨</div>';return s}

/* ---- the House remembers (guarded; no-ops with no session) ---- */
const SB_URL='https://pcgzhlxjcjdeweygdzci.supabase.co';
const SB_KEY='sb_publishable_TKJjv10k4Gg6lzDrwpopkQ_-Vf3yO_x';
const sb=(window.supabase&&window.supabase.createClient)?window.supabase.createClient(SB_URL,SB_KEY):null;
async function hUser(){ if(!sb||!sb.auth) return null; try{ const {data}=await sb.auth.getUser(); return (data&&data.user)||null; }catch(e){ return null; } }
async function persistName(name){ const u=await hUser(); if(!u||!name) return; try{ await sb.from('profiles').update({display_name:name}).eq('id',u.id); }catch(e){} }
async function persistShell(shell){ const u=await hUser(); if(!u||!shell) return; try{ await sb.from('rooms').update({shell:shell, updated_at:new Date().toISOString()}).eq('user_id',u.id); }catch(e){} }
function breadcrumb(){ try{ localStorage.setItem('hol_firstnight', JSON.stringify({shell:_chosen, name:houseName})); }catch(e){} }

/* ---- the Keeper's voice ---- */
const keeperEl=document.getElementById('keeper');
function say(lines){ // array of {t, dim}, sequential
  keeperEl.innerHTML='';
  lines.forEach((l)=>{ const d=document.createElement('span'); d.className='line'+(l.dim?' dim':''); d.textContent=l.t; keeperEl.appendChild(d); });
  const spans=[...keeperEl.children]; let t=200;
  spans.forEach((s)=>{ setTimeout(()=>s.classList.add('show'), t); t+=1500; });
  return t; // total ms
}

/* ---- flow ---- */
const $=id=>document.getElementById(id);
let houseName='';
function toArrival(){
  const after=say([
    {t:"You came all the way in."},
    {t:"Good. The House is best late.", dim:true},
    {t:"Here — this is yours. It opens your room, and everything you keep."}
  ]);
  setTimeout(()=>$('key').classList.add('show'), after-900);
  setTimeout(toName, after+700);
}
function toName(){
  say([{t:"What shall the House call you?"}]);
  setTimeout(()=>{ $('namewrap').classList.add('show'); $('nameInput').focus(); }, 900);
}
$('nameGo').onclick=submitName;
$('nameInput').addEventListener('keydown',e=>{ if(e.key==='Enter') submitName(); });
function submitName(){
  const v=$('nameInput').value.trim();
  houseName = v || 'Wanderer';
  persistName(houseName);
  $('namewrap').classList.remove('show');
  $('key').classList.remove('show');
  const after=say([
    {t:'…'+houseName+'. It suits you.'},
    {t:"Now — one thing, before I show you upstairs.", dim:true}
  ]);
  setTimeout(toQuestion, after+400);
}
function toQuestion(){
  keeperEl.innerHTML='';
  document.body.classList.add('choosing');
  $('question').classList.add('show');
  buildShells();
  setTimeout(()=>$('shelves').classList.add('show'), 500);
}
function buildShells(){
  const g=$('shelves'); g.innerHTML='';
  SHELLS.forEach(sh=>{
    const el=document.createElement('div'); el.className='shell';
    el.innerHTML=`<div class="scene">
        <div class="grad" style="background:linear-gradient(180deg,${sh.wall[0]},${sh.wall[1]})"></div>
        ${sh.sig||''}
        <div class="win" style="background:${sh.win}"></div>
        <div class="grad" style="top:auto;bottom:0;height:34%;background:linear-gradient(180deg,transparent,${sh.floor[1]})"></div>
      </div>
      <div class="label"><span class="e">${sh.e}</span>
        <div class="n">${sh.name}</div><div class="f">${sh.feel}</div></div>`;
    el.onclick=()=>choose(sh);
    g.appendChild(el);
  });
}

/* ---- the room forms ---- */
function choose(sh){
  document.body.classList.remove('choosing');
  $('question').classList.remove('show');
  $('shelves').classList.remove('show');
  $('candle').style.opacity='0';
  const after=say([
    {t:sh.reply},
    {t:"Your room is upstairs.", dim:true}
  ]);
  setTimeout(()=>formRoom(sh), after+300);
}
function formRoom(sh){
  keeperEl.innerHTML='';
  const f=$('formed');
  f.querySelector('.wall').style.background=`radial-gradient(120% 90% at 30% 0%, ${sh.wall[0]}, ${sh.wall[1]})`;
  f.querySelector('.floor').style.background=`linear-gradient(180deg,${sh.floor[0]},${sh.floor[1]})`;
  $('fwin').style.background=sh.win; $('fwin').innerHTML=sh.sig||'';
  $('famb').style.background=`radial-gradient(60% 55% at 30% 62%, ${sh.amb}, transparent 64%)`;
  // the five bare essentials of the First Night
  const things=[
    {e:'🛏️', t:'Bed',    x:22, y:74},
    {e:'🗄️', t:'Desk',   x:44, y:76},
    {e:'🕯️', t:'Candle', x:60, y:72},
    {e:'📓', t:'Journal',x:38, y:70},
    {e:'🪟', t:'',       x:69, y:32}
  ];
  things.forEach(o=>{ const d=document.createElement('div'); d.className='thing';
    d.style.left=o.x+'%'; d.style.top=o.y+'%'; d.innerHTML=`${o.e}${o.t?`<span class="t">${o.t}</span>`:''}`;
    f.querySelector('.room').appendChild(d); });
  f.classList.add('show');
  setTimeout(()=>f.classList.add('things'), 700);
  // a brass plaque with their name, briefly, on the door line
  setTimeout(()=>{ say([{t:''}]); keeperEl.innerHTML='<div style="margin-top:-8vh"><span class="plaque">'+houseName+'</span></div>'; }, 500);
  setTimeout(()=>{ keeperEl.innerHTML=''; $('note').classList.add('show'); }, 2100);
  setTimeout(()=>$('stepIn').classList.add('show'), 3000);
}

$('stepIn').onclick=()=>{
  $('blackout').classList.add('on');
  const url='/you.html?shell='+encodeURIComponent(chosenId())+'&name='+encodeURIComponent(houseName);
  const onSite = location.protocol.startsWith('http');
  setTimeout(()=>{ if(onSite){ location.href=url; } else {
    // standalone/artifact: the walk continues on the live House
    $('blackout').classList.remove('on');
    keeperEl.innerHTML=''; say([{t:"On the House, this door opens into your room."},{t:"For now — welcome home, "+houseName+".", dim:true}]);
    $('stepIn').classList.remove('show');
  } }, 1000);
};
let _chosen='blank';
function choose_wrap(){}
function chosenId(){ return _chosen; }
// capture chosen id
const _origChoose=choose;
choose=function(sh){ _chosen=sh.id; breadcrumb(); persistShell(sh.id); _origChoose(sh); };

$('restart').onclick=()=>location.reload();

/* boot */
setTimeout(toArrival, 900);
</script>
