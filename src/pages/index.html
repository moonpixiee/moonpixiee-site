<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>The Grand Hall · House of Luna</title>
<link rel="stylesheet" href="/styles/tokens.css"/>
<style>
  /* ============================================================
     THE GRAND HALL — the one continuous wall. The photoreal environment fills the
     view; interaction is composited on it (north star). Every door is a real way
     in: it wakes with its own colour as you approach, names itself, and opens to
     its room. Lanterns flicker, dust drifts, the hall parallaxes as you look down it.
     ============================================================ */
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:#070505;overflow:hidden;}
  .hall{position:fixed;inset:0;overflow:hidden;background:#070505;}
  .env{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:max(100vw,150vh);aspect-ratio:1536/1024;will-change:transform;
    transition:transform .6s cubic-bezier(.22,1,.36,1);}
  .env img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}

  .fx{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;}
  .lantern{position:absolute;transform:translate(-50%,-50%);border-radius:50%;
    background:radial-gradient(circle at 50% 50%, rgba(255,206,130,.42) 0%, rgba(240,168,70,.18) 40%, transparent 72%);}
  @keyframes flick{0%,100%{opacity:.9;}42%{opacity:.72;}66%{opacity:1;}84%{opacity:.82;}}
  .lantern-anim{animation:flick calc(3s + var(--d,0s)) ease-in-out infinite;}
  .mote{position:absolute;width:2px;height:2px;border-radius:50%;
    background:radial-gradient(circle, rgba(255,224,160,.85), rgba(255,224,160,0));mix-blend-mode:screen;}
  @keyframes rise{0%{transform:translateY(0) translateX(0);opacity:0;}12%{opacity:.7;}80%{opacity:.4;}100%{transform:translateY(-110px) translateX(var(--dx,4px));opacity:0;}}

  /* a DOOR — a hotspot over the painted door; wakes in its own colour on approach */
  .door{position:absolute;transform:translate(-50%,-50%);display:block;text-decoration:none;color:transparent;
    cursor:pointer;outline:none;z-index:3;}
  .door .glow{position:absolute;inset:-24% -20%;border-radius:46% 46% 8% 8%/40% 40% 6% 6%;pointer-events:none;mix-blend-mode:screen;
    background:radial-gradient(52% 60% at 50% 46%, rgba(var(--g),.5) 0%, rgba(var(--g),.18) 44%, transparent 74%);
    opacity:calc(.16 + .9*var(--w,0));transform:scale(calc(1 + .05*var(--w,0)));
    transition:opacity .55s ease, transform .55s ease;}
  .door .name{position:absolute;left:50%;bottom:-10%;transform:translateX(-50%);white-space:nowrap;
    font-family:var(--font-architect,'Cormorant Garamond',serif);font-variant:small-caps;letter-spacing:.14em;
    font-size:clamp(.8rem,1.5vw,1.2rem);color:rgba(240,228,206,.96);opacity:var(--w,0);transition:opacity .4s ease;
    text-shadow:0 1px 3px rgba(0,0,0,.9), 0 0 14px rgba(var(--g),.7);pointer-events:none;}
  .door:focus-visible{box-shadow:0 0 0 3px rgba(227,163,74,.7);border-radius:8px;}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;} .door .glow{opacity:.16;}}
</style>
</head>
<body>
  <div class="hall" id="hall">
    <div class="env" id="env">
      <img src="/assets/grandhall-env.png" alt="The Grand Hall — one continuous stone wall of seven arched doors, each lit by its own coloured lantern"/>
      <span class="fx" id="fx"></span>
    </div>
  </div>

<script>
  var still=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var env=document.getElementById('env'), fx=document.getElementById('fx');
  // seven doors, left→right, in the wall's gradient of light
  var DOORS=[
    {name:'The Library',      route:'/library',        x:9,  y:57, w:14, h:46, g:'236,178,96',  lx:9,  ly:33},
    {name:'The Edit',         route:'/edit',           x:25, y:56, w:13, h:44, g:'214,96,146',  lx:26, ly:34},
    {name:'VELVET//CTRL',     route:'/velvet',         x:41, y:55, w:12, h:41, g:'226,52,64',   lx:44, ly:34},
    {name:'The Machine Room', route:'/machineroom.html',x:56, y:54, w:11, h:38, g:'240,168,80', lx:59, ly:36},
    {name:'Work With Luna',   route:'/work',           x:69, y:53, w:9,  h:34, g:'234,184,110', lx:72, ly:37},
    {name:"Luna's Room",      route:'/luna',           x:80, y:52, w:8,  h:31, g:'150,180,235', lx:83, ly:38},
    {name:'Your Room',        route:'/you',            x:91, y:52, w:7,  h:28, g:'176,172,160', lx:93, ly:39}
  ];
  // lantern flicker glows
  DOORS.forEach(function(d,i){
    var l=document.createElement('span'); l.className='lantern'+(still?'':' lantern-anim');
    l.style.left=d.lx+'%'; l.style.top=d.ly+'%'; l.style.width=(7-i*0.4)+'%'; l.style.height=(11-i*0.7)+'%';
    l.style.setProperty('--d',(i*0.35)+'s'); fx.appendChild(l);
  });
  // dust across the warm middle
  for(var i=0;i<(still?8:26);i++){var m=document.createElement('span');m.className='mote';
    m.style.left=(6+Math.random()*88).toFixed(1)+'%';m.style.top=(28+Math.random()*44).toFixed(1)+'%';
    if(still){m.style.opacity='0.32';}else{m.style.setProperty('--dx',(Math.random()*10-5).toFixed(0)+'px');m.style.animation='rise '+(6+Math.random()*6).toFixed(1)+'s linear '+(-Math.random()*10).toFixed(1)+'s infinite';}
    fx.appendChild(m);}
  // door hotspots
  var doorEls=DOORS.map(function(d){
    var a=document.createElement('a'); a.className='door'; a.href=d.route; a.setAttribute('aria-label','Enter '+d.name);
    a.style.left=d.x+'%'; a.style.top=d.y+'%'; a.style.width=d.w+'%'; a.style.height=d.h+'%'; a.style.setProperty('--g',d.g);
    a.innerHTML='<span class="glow"></span><span class="name">'+d.name+'</span>';
    env.appendChild(a); return {a:a,d:d};
  });
  if(!still){
    window.addEventListener('mousemove',function(e){
      var r=env.getBoundingClientRect();
      var nx=(e.clientX-r.left)/r.width*100, ny=(e.clientY-r.top)/r.height*100;
      doorEls.forEach(function(o){
        var dx=(nx-o.d.x)/(o.d.w*0.9), dy=(ny-o.d.y)/(o.d.h*0.9);
        var w=Math.max(0,Math.min(1,1-Math.hypot(dx,dy)));
        o.a.style.setProperty('--w', w.toFixed(3));
      });
      var px=((e.clientX/window.innerWidth)-0.5), py=((e.clientY/window.innerHeight)-0.5);
      env.style.transform='translate(calc(-50% + '+(-px*18).toFixed(1)+'px), calc(-50% + '+(-py*10).toFixed(1)+'px))';
    },{passive:true});
    document.addEventListener('mouseleave',function(){doorEls.forEach(function(o){o.a.style.setProperty('--w','0');});env.style.transform='translate(-50%,-50%)';});
  }
</script>
</body>
</html>
