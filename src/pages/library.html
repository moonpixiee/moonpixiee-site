<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>The Library · House of Luna</title>
<link rel="stylesheet" href="/styles/tokens.css"/>
<style>
  /* ============================================================
     THE LIBRARY HUB — one photoreal room you STAND IN (House of Luna, 9 Aug 2026).
     Not a menu. Invisible hotspots sit over real objects; hover breathes a whisper,
     click and the camera WALKS you into that room. The House reveals itself over
     days — on the first night only the shelves and the fire; the rest arrives as
     you keep returning. Loose Pages doesn't open like a door — the camera kneels
     and the page fills the screen. Curiosity is the only navigation.
     ============================================================ */
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{ --gold:#E3B968; --paper:#EFE7D8; --ease:cubic-bezier(.22,1,.36,1); }
  html,body{height:100%;background:#05040a;overflow:hidden;font-family:var(--font-narrator,Georgia,serif);color:var(--paper);}
  .stage{position:fixed;inset:0;overflow:hidden;background:#05040a;}
  .env{position:absolute;top:50%;left:50%;width:104vw;aspect-ratio:1672/941;transform:translate(-50%,-50%);
    transition:transform .5s var(--ease);will-change:transform;}
  /* portrait/phone: fit the WHOLE width so every doorway is visible & tappable (letterboxed) */
  @media (max-aspect-ratio:3/4){ .env{width:100vw;height:auto;} }
  .plane{position:absolute;inset:0;transform-origin:50% 50%;will-change:transform;}
  .plane img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
  .plane.walk{transition:transform 1.15s cubic-bezier(.5,0,.72,0);transform:scale(2.9);}
  .vignette{position:absolute;inset:0;pointer-events:none;z-index:2;
    background:radial-gradient(122% 100% at 50% 44%, transparent 40%, rgba(4,3,8,.5) 82%, rgba(4,3,8,.85) 100%);}
  .dust{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2;}
  .mote{position:absolute;width:2px;height:2px;border-radius:50%;background:radial-gradient(circle, rgba(255,224,160,.8), rgba(255,224,160,0));mix-blend-mode:screen;}
  @keyframes rise{0%{transform:translateY(0);opacity:0;}14%{opacity:.6;}80%{opacity:.35;}100%{transform:translateY(-120px) translateX(var(--dx,3px));opacity:0;}}

  /* a WAY THROUGH — invisible until your cursor nears it, then a whisper */
  .way{position:absolute;transform:translate(-50%,-50%);width:clamp(40px,7vw,110px);height:clamp(52px,11vw,150px);
    cursor:pointer;z-index:5;outline:none;}
  .way .halo{position:absolute;inset:-8% -12%;border-radius:44% 44% 40% 40%/48%;pointer-events:none;mix-blend-mode:screen;
    background:radial-gradient(52% 58% at 50% 46%, rgba(240,196,110,.5) 0%, rgba(240,196,110,.16) 46%, transparent 74%);
    opacity:calc(.06 + .9*var(--w,0));transition:opacity .55s var(--ease);}
  .way.up .halo{background:radial-gradient(52% 58% at 50% 46%, rgba(180,200,245,.5) 0%, rgba(150,180,235,.16) 46%, transparent 74%);}
  .way.mirror .halo{background:radial-gradient(52% 58% at 50% 46%, rgba(210,210,225,.5) 0%, rgba(180,185,210,.16) 46%, transparent 74%);}
  .way .whisper{position:absolute;left:50%;bottom:118%;transform:translateX(-50%) translateY(8px);width:max-content;max-width:min(76vw,260px);
    text-align:center;padding:0;opacity:0;pointer-events:none;filter:blur(3px);transition:opacity .42s var(--ease), transform .42s var(--ease), filter .42s var(--ease);}
  .way .whisper::before{content:"";position:absolute;inset:-70% -40%;z-index:-1;pointer-events:none;background:radial-gradient(closest-side, rgba(8,6,10,.6), transparent 78%);filter:blur(9px);}
  .way:hover .whisper,.way:focus-visible .whisper,.way.awake .whisper{opacity:1;filter:blur(0);transform:translateX(-50%) translateY(0);}
  .way .wl{display:block;font-family:var(--font-narrator,Georgia,serif);font-style:italic;font-size:.98rem;line-height:1.4;color:rgba(244,236,220,.96);text-shadow:0 1px 12px rgba(0,0,0,.98);}
  .way .wn{display:block;margin-top:.3rem;font-family:var(--font-machine,monospace);font-size:.54rem;letter-spacing:.24em;text-transform:uppercase;color:rgba(227,185,104,.9);text-shadow:0 1px 8px rgba(0,0,0,.95);}
  .way.fresh .halo{animation:beckon 3.6s ease-in-out infinite;}
  @keyframes beckon{0%,100%{opacity:.12;}50%{opacity:.4;}}

  .return{position:fixed;top:clamp(1rem,3vw,1.7rem);left:clamp(1rem,3.4vw,2rem);z-index:8;font-family:var(--font-architect,'Cormorant Garamond',serif);font-variant:small-caps;letter-spacing:.12em;font-size:clamp(.82rem,1.5vw,1.05rem);color:rgba(227,185,104,.82);text-decoration:none;text-shadow:0 1px 6px rgba(0,0,0,.9);transition:color .3s;}
  .return:hover{color:#F2DCA4;}
  .place{position:fixed;top:clamp(1rem,3vw,1.7rem);left:50%;transform:translateX(-50%);z-index:8;font-family:var(--font-architect,'Cormorant Garamond',serif);font-variant:small-caps;letter-spacing:.24em;font-size:clamp(.78rem,1.6vw,1.08rem);color:rgba(233,224,208,.7);text-shadow:0 1px 8px rgba(0,0,0,.95);}
  @media (max-aspect-ratio:3/4){ .place{top:auto;bottom:clamp(3.4rem,10vh,5rem);} }
  .hint{position:fixed;left:0;right:0;bottom:clamp(1.6rem,5vh,2.6rem);text-align:center;z-index:7;font-family:var(--font-narrator,Georgia,serif);font-style:italic;font-size:.92rem;color:rgba(233,224,208,.4);opacity:0;animation:hintin 1.4s ease 1.6s forwards;}
  @keyframes hintin{to{opacity:1;}}
  .reveal{position:fixed;left:50%;bottom:clamp(4.4rem,11vh,6.4rem);transform:translateX(-50%) translateY(10px);z-index:9;
    background:rgba(12,9,16,.9);border:1px solid rgba(200,214,255,.4);border-radius:7px;padding:.6rem 1.15rem;
    font-family:var(--font-architect,serif);font-variant:small-caps;letter-spacing:.08em;color:rgba(210,222,255,.95);opacity:0;transition:opacity .5s,transform .5s;}
  .reveal.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* arrival fade + the walk-out curtain */
  .curtain{position:fixed;inset:0;z-index:30;background:#000;pointer-events:none;opacity:1;animation:arrive 1.8s ease .1s both;}
  @keyframes arrive{from{opacity:1;}to{opacity:0;}}
  .curtain.down{animation:none;opacity:0;transition:opacity .7s ease .35s;}
  .curtain.down.on{opacity:1;}
  /* the kneel — a page rises off the floor and fills the view */
  .kneel{position:fixed;z-index:28;pointer-events:none;background:linear-gradient(160deg,#efe6d2,#d9cba8);border:1px solid #b8a06a;
    box-shadow:0 40px 120px -20px rgba(0,0,0,.85);opacity:0;}
  .kneel.go{animation:kneel 1.15s cubic-bezier(.4,0,.3,1) forwards;}
  @keyframes kneel{0%{opacity:0;transform:translate(-50%,-50%) scale(.06) rotate(-8deg);}18%{opacity:1;}100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0deg);}}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;} .plane.walk{transform:none;} .curtain{display:none;}}
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="env" id="env">
      <div class="plane" id="plane">
        <img id="envimg" src="/assets/library-hub-env.png" alt="The Library — a great candlelit rotunda of towering shelves, a round reading table beneath a rose window, a hearth glowing to one side"/>
      </div>
    </div>
    <div class="vignette"></div>
    <div class="dust" id="dust"></div>
  </div>
  <a class="return" href="/" aria-label="Back to the Grand Hall">&larr; The Grand Hall</a>
  <span class="place">The Library</span>
  <p class="hint" id="hint">Some things only show themselves when you look.</p>
  <div class="reveal" id="reveal"></div>
  <div class="curtain" id="curtain" aria-hidden="true"></div>

<script>
(function(){
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var touch = matchMedia('(hover: none)').matches;
  var suppressClick=false, armedWay=null;
  // ---- the ways through. unlock = days since you first entered the Library ---
  // Day 0 (first night): only the Shelves and the Hearth. The rest arrives with
  // return visits. x/y are % on the Hub render; kneel:true → the camera kneels.
  // discovery (day-by-day reveal) is OFF for now — every doorway shows at once.
  var DISCOVERY=false;
  var WAYS=[
    {id:'maintable',  route:'/maintable.html',   line:'The day’s work, left open.',           name:'The Long Table',     x:50, y:64, unlock:0},
    {id:'bookshelves',route:'/bookshelves.html', line:'Some books remember who opened them.', name:'The Shelves',        x:9,  y:47, unlock:0},
    {id:'mirror',     route:'/mirror.html',      line:'Look again.',                          name:'The Mirror', mirror:true,x:18, y:44, unlock:0},
    {id:'terminal',   route:'/terminal.html',    line:'The House is awake.',                  name:'A Glow',             x:30, y:48, unlock:0},
    {id:'loosepages', route:'/loosepages.html',  line:'One page escaped.',                    name:'A Loose Page', kneel:true, x:43, y:85, unlock:0},
    {id:'hiddendesk', route:'/hiddendesk.html',  line:'Someone stopped writing.',             name:'A Desk, Half-Hidden',x:67, y:50, unlock:0},
    {id:'upstairs',   route:'/upstairs.html',    line:'Higher.',                              name:'The Stairs', up:true, x:80, y:54, unlock:0},
    {id:'fireplace',  route:'/fireplace.html',   line:'The fire has been waiting.',           name:'The Hearth',         x:91, y:56, unlock:0}
  ];

  var env=document.getElementById('env'), plane=document.getElementById('plane'), stage=document.getElementById('stage');
  var curtain=document.getElementById('curtain'), reveal=document.getElementById('reveal'), hint=document.getElementById('hint');

  // ---- how many days since first entering (the House reveals itself slowly) --
  function midnight(d){ return Math.floor(new Date(d).setHours(0,0,0,0)/86400000); }
  var LSf='hol_lib_first', LSseen='hol_lib_seen', LSfound='hol_lib_found';
  var todayN=midnight(new Date());
  var first=parseInt(localStorage.getItem(LSf)||'',10);
  if(isNaN(first)){ first=todayN; try{localStorage.setItem(LSf,String(first));}catch(e){} }
  var daysIn=Math.max(0, todayN-first);
  // dev peek: /library?all reveals everything (for building/testing)
  var devAll=/[?&]all\b/.test(location.search);
  function arr(k){ try{ return JSON.parse(localStorage.getItem(k)||'[]'); }catch(e){ return []; } }
  function add(k,id){ var a=arr(k); if(a.indexOf(id)<0){ a.push(id); try{localStorage.setItem(k,JSON.stringify(a));}catch(e){} } }
  var found=arr(LSfound), seen=arr(LSseen);

  // ---- place the ways that are unlocked -------------------------------------
  var justRevealed=[];
  WAYS.forEach(function(w){
    var open = !DISCOVERY || devAll || daysIn>=w.unlock || found.indexOf(w.id)>=0;
    if(!open) return;
    var fresh = seen.indexOf(w.id)<0;               // newly revealed since last visit
    if(fresh){ justRevealed.push(w); add(LSseen,w.id); }
    var el=document.createElement('div');
    el.className='way'+(w.up?' up':'')+(w.mirror?' mirror':'')+(fresh?' fresh':'');
    el.tabIndex=0; el.setAttribute('role','link'); el.setAttribute('aria-label',w.name+' — '+w.line);
    el.style.left=w.x+'%'; el.style.top=w.y+'%';
    el.innerHTML='<span class="halo"></span><span class="whisper"><span class="wl">'+w.line+'</span><span class="wn">'+w.name+'</span></span>';
    el.addEventListener('click',function(){ if(suppressClick) return; if(touch){ if(!el.classList.contains('awake')){ if(armedWay){ armedWay.classList.remove('awake'); armedWay.style.setProperty('--w','0'); } el.classList.add('awake'); el.style.setProperty('--w','1'); armedWay=el; return; } } enter(w); });
    el.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); enter(w); } });
    plane.appendChild(el);
    w._el=el;
  });

  // gently announce when the House has opened a little further
  if(DISCOVERY && justRevealed.length && !reduce){
    var msg = daysIn===0 ? '' : 'The House has opened a little further.';
    if(msg){ setTimeout(function(){ reveal.textContent=msg; reveal.classList.add('show');
      setTimeout(function(){ reveal.classList.remove('show'); }, 4200); }, 2200); }
  }
  if(DISCOVERY && daysIn===0){ hint.textContent='The shelves, and the fire. The rest of the House is still waking.'; }

  // ---- cursor-proximity wake for each way (desktop) -------------------------
  if(!reduce && !touch){
    addEventListener('mousemove',function(e){
      var r=env.getBoundingClientRect();
      var nx=(e.clientX-r.left)/r.width*100, ny=(e.clientY-r.top)/r.height*100;
      WAYS.forEach(function(w){ if(!w._el) return;
        var dx=(nx-w.x)/7, dy=(ny-w.y)/11; var wgt=Math.max(0,Math.min(1,1-Math.hypot(dx,dy)));
        w._el.style.setProperty('--w', wgt.toFixed(3)); });
      var px=(e.clientX/innerWidth-.5), py=(e.clientY/innerHeight-.5);
      env.style.transform='translate(calc(-50% + '+(-px*12).toFixed(1)+'px), calc(-50% + '+(-py*8).toFixed(1)+'px))';
    },{passive:true});
    addEventListener('mouseleave',function(){ WAYS.forEach(function(w){ if(w._el) w._el.style.setProperty('--w','0'); }); env.style.transform='translate(-50%,-50%)'; });
  }
  // ---- touch: drag to look around; tap once to reveal a doorway, twice to enter
  if(touch){
    hint.textContent='Tap a doorway to reveal it · tap again to enter';
    var panX=0, sx=0, spn=0, drag=false;
    function maxPan(){ var w=env.getBoundingClientRect().width; return Math.max(0,(w-innerWidth)/2); }
    stage.addEventListener('touchstart',function(e){ if(e.touches.length!==1||moving) return; sx=e.touches[0].clientX; spn=panX; drag=false; },{passive:true});
    stage.addEventListener('touchmove',function(e){ if(e.touches.length!==1||moving) return; var dx=e.touches[0].clientX-sx; if(Math.abs(dx)>8) drag=true; if(drag){ var mp=maxPan(); panX=Math.max(-mp,Math.min(mp,spn+dx)); env.style.transition='none'; env.style.transform='translate(calc(-50% + '+panX.toFixed(0)+'px),-50%)'; } },{passive:true});
    stage.addEventListener('touchend',function(e){ if(drag){ suppressClick=true; setTimeout(function(){ suppressClick=false; },350); } else if(!e.target.closest('.way') && armedWay){ armedWay.classList.remove('awake'); armedWay.style.setProperty('--w','0'); armedWay=null; } },{passive:true});
  }

  // ---- entering a room: the camera walks (or kneels) ------------------------
  var moving=false;
  function go(route){ location.href=route; }
  function enter(w){
    if(moving) return; moving=true; add(LSfound,w.id);
    if(reduce){ go(w.route); return; }
    if(w.kneel){ kneelInto(w); return; }
    // walk forward: the room scales up from the point you clicked, then fades
    plane.style.transformOrigin=w.x+'% '+w.y+'%';
    plane.classList.add('walk');
    curtain.classList.add('down'); requestAnimationFrame(function(){ curtain.classList.add('on'); });
    setTimeout(function(){ go(w.route); }, 1150);
  }
  function kneelInto(w){
    // the camera kneels — a single page lifts off the floor and fills the view
    var r=env.getBoundingClientRect();
    var k=document.createElement('div'); k.className='kneel';
    var W=Math.min(innerWidth*0.82, 720), H=W*1.3;
    k.style.width=W+'px'; k.style.height=H+'px';
    k.style.left='50%'; k.style.top='50%';
    document.body.appendChild(k);
    // start it small, anchored near where the page lay on the floor
    requestAnimationFrame(function(){ k.classList.add('go'); });
    curtain.classList.add('down'); setTimeout(function(){ curtain.classList.add('on'); }, 780);
    setTimeout(function(){ go(w.route); }, 1200);
  }

  // ---- dust ------------------------------------------------------------------
  var dust=document.getElementById('dust');
  for(var i=0;i<(reduce?8:26);i++){ var m=document.createElement('span'); m.className='mote';
    m.style.left=(4+Math.random()*92).toFixed(1)+'%'; m.style.top=(8+Math.random()*84).toFixed(1)+'%';
    if(reduce){ m.style.opacity='0.3'; } else { m.style.setProperty('--dx',(Math.random()*8-4).toFixed(0)+'px'); m.style.animation='rise '+(7+Math.random()*7).toFixed(1)+'s linear '+(-Math.random()*12).toFixed(1)+'s infinite'; }
    dust.appendChild(m); }
})();
</script>
</body>
</html>
