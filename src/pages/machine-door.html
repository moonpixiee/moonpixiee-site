<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Threshold of the Machine Room · House of Luna</title>
<link rel="stylesheet" href="/styles/tokens.css"/>
<style>
  /* THRESHOLD of the Machine Room — the doorway you arrive at from the Grand Hall.
     A cinematic arrival: fade from black, a slow push-in toward the door, the light
     breathing, dust drifting, the lantern flickering. The doorway itself is the
     interaction — click it (or press Enter) to cross into the room. Part of the House architecture, not a loading screen. */
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:#050403;overflow:hidden;}
  body{cursor:pointer;--g:240,170,70;}
  .scene{position:fixed;inset:0;display:block;overflow:hidden;background:#050403;text-decoration:none;color:transparent;outline:none;}
  .bg{position:absolute;inset:-6%;background:url('/assets/machine-full.png') center/cover no-repeat;filter:blur(38px) brightness(.36) saturate(.9);transform:scale(1.08);}
  .bg-veil{position:absolute;inset:0;pointer-events:none;background:radial-gradient(122% 104% at 50% 46%, transparent 36%, rgba(5,4,3,.56) 80%, rgba(5,4,3,.86) 100%);}
  /* the doorway dominates the view; a slow push-in on load; parallax rides on top */
  .art{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);height:min(103vh, calc(100vw * 1536 / 1024));aspect-ratio:1024/1536;will-change:transform,scale;scale:1;animation:pushin 3.4s cubic-bezier(.22,1,.36,1) both;box-shadow:0 40px 100px -24px rgba(0,0,0,.85);transition:transform .5s cubic-bezier(.22,1,.36,1);}
  @keyframes pushin{from{scale:1.12;}to{scale:1;}}
  @keyframes breathe{0%,100%{filter:brightness(1);}50%{filter:brightness(1.13);}}
  .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
  .fx{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;}
  .fx>span{position:absolute;transform:translate(-50%,-50%);transition:opacity .5s ease, transform .5s ease, filter .5s ease;}
  .flame{left:51%;top:11%;width:24%;height:15%;background:radial-gradient(circle at 50% 50%, rgba(240,170,70,.6) 0%, rgba(240,170,70,.28) 34%, rgba(240,170,70,.09) 58%, transparent 76%);filter:brightness(calc(1 + .2*var(--w,0)));}
  .spill{left:58%;top:60%;width:46%;height:62%;background:radial-gradient(44% 58% at 50% 40%, rgba(240,170,70,.4) 0%, rgba(240,170,70,.19) 42%, transparent 80%);opacity:calc(.66 + .6*var(--w,0));transform:translate(-50%,-50%) scale(calc(1 + .08*var(--w,0)));animation:breathe 6.5s ease-in-out infinite;}
  .pool{left:53%;top:90%;width:58%;height:20%;background:radial-gradient(50% 100% at 50% 0%, rgba(240,170,70,.42) 0%, transparent 78%);opacity:calc(.64 + .5*var(--w,0));animation:breathe 7.5s ease-in-out infinite;}
  .dust{left:0;top:0;transform:none;width:100%;height:100%;}
  .mote{position:absolute;width:2px;height:2px;border-radius:50%;background:radial-gradient(circle, rgba(255,236,200,.85), rgba(255,236,200,0));mix-blend-mode:screen;}
  @keyframes rise{0%{transform:translateY(0);opacity:0;}12%{opacity:.8;}80%{opacity:.5;}100%{transform:translateY(-140px) translateX(var(--dx,4px));opacity:0;}}
  @keyframes flick{0%,100%{opacity:1;}38%{opacity:.82;filter:brightness(1.08);}64%{opacity:.94;}82%{opacity:.86;}}
  @media (prefers-reduced-motion:no-preference){ .flame{animation:flick 3.4s cubic-bezier(.22,1,.36,1) infinite;} }
  @media (prefers-reduced-motion:reduce){ .art{transition:none;animation:none;scale:1;} .spill{opacity:1;animation:none;} .pool{opacity:.95;animation:none;} .fade{display:none;} }
  /* return to the Hall — elegant gold text, no button */
  .return{position:fixed;top:clamp(1rem,3vw,1.7rem);left:clamp(1rem,3.4vw,2rem);z-index:6;font-family:var(--font-architect,'Cormorant Garamond',serif);font-variant:small-caps;letter-spacing:.12em;font-size:clamp(.82rem,1.5vw,1.05rem);color:rgba(226,196,130,.82);text-decoration:none;text-shadow:0 1px 5px rgba(0,0,0,.9);transition:color .3s;}
  .return:hover{color:#F2DCA4;}
  .enter-cue{position:fixed;left:0;right:0;bottom:clamp(1.1rem,4vh,2.2rem);text-align:center;z-index:5;pointer-events:none;font-family:var(--font-machine,monospace);font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:rgba(240,224,196,.5);opacity:0;animation:cueIn 1.4s ease 3s forwards;text-shadow:0 0 12px rgba(240,170,70,.55);}
  @keyframes cueIn{to{opacity:1;}}
  /* fade from black on arrival */
  .fade{position:fixed;inset:0;z-index:30;background:#000;pointer-events:none;animation:fadeout 1.7s ease .1s both;}
  @keyframes fadeout{from{opacity:1;}to{opacity:0;}}
  .scene:focus-visible{box-shadow:inset 0 0 0 3px rgba(227,163,74,.55), inset 0 0 60px rgba(227,163,74,.25);}
</style></head><body>
  <a class="scene" href="/machineroom.html" aria-label="Enter The Machine Room" id="scene">
    <div class="bg" aria-hidden="true"></div><div class="bg-veil" aria-hidden="true"></div>
    <div class="art" id="art">
      <img src="/assets/machine-full.png" alt="Threshold of the Machine Room — an ancient arched wooden door in stone, a lantern above, light within"/>
      <span class="fx"><span class="spill"></span><span class="pool"></span><span class="flame"></span><span class="dust" id="dust"></span></span>
    </div>
    <span class="enter-cue">Click the door to enter</span>
  </a>
  <a class="return" href="/">&larr; The Grand Hall</a>
  <div class="fade" aria-hidden="true"></div>
<script>
  var still=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var art=document.getElementById('art'), dust=document.getElementById('dust'), scene=document.getElementById('scene');
  document.addEventListener('keydown',function(e){ if((e.key==='Enter'||e.key===' ')&&scene){ e.preventDefault(); window.location.href=scene.getAttribute('href'); } });
  var zones=[{x:60,y:58,s:20},{x:51,y:14,s:9}];
  for(var i=0;i<(still?6:22);i++){var z=zones[i%2],m=document.createElement('span');m.className='mote';
    m.style.left=(z.x+(Math.random()*z.s-z.s/2)).toFixed(1)+'%';m.style.top=(z.y+(Math.random()*z.s-z.s/2)).toFixed(1)+'%';
    if(still){m.style.opacity='0.4';}else{m.style.setProperty('--dx',(Math.random()*10-5).toFixed(0)+'px');m.style.animation='rise '+(5.5+Math.random()*5).toFixed(1)+'s linear '+(-Math.random()*9).toFixed(1)+'s infinite';}
    dust.appendChild(m);}
  if(!still){var DCX=0.57,DCY=0.63;
    window.addEventListener('mousemove',function(e){var r=art.getBoundingClientRect();var nx=(e.clientX-r.left)/r.width,ny=(e.clientY-r.top)/r.height;
      var w=Math.max(0,Math.min(1,1-Math.hypot(nx-DCX,ny-DCY)/0.5));art.style.setProperty('--w',w.toFixed(3));
      var px=((e.clientX/window.innerWidth)-0.5),py=((e.clientY/window.innerHeight)-0.5);
      art.style.transform='translate(calc(-50% + '+(-px*14).toFixed(1)+'px), calc(-50% + '+(-py*10).toFixed(1)+'px))';},{passive:true});
    document.addEventListener('mouseleave',function(){art.style.setProperty('--w','0');art.style.transform='translate(-50%,-50%)';});}
</script></body></html>
